<div class="max-w-3xl mx-auto p-4">
  <h1 class="text-2xl font-bold">Meets — Admin</h1>
  <div id="login" class="bg-white rounded-xl shadow p-4 mt-3">
    <div id="loginWidget"></div>
  </div>

  <div id="app" class="hidden">
    <div class="bg-white rounded-xl shadow p-4 mt-3">
      <h2 class="font-bold mb-2">New meet</h2>
      <div class="grid grid-cols-2 gap-2">
        <input id="mName" class="border rounded p-2 col-span-2" placeholder="Meet name">
        <input id="mDate" type="date" class="border rounded p-2">
        <input id="mClose" type="datetime-local" class="border rounded p-2" title="Entries close">
        <input id="mLoc" class="border rounded p-2 col-span-2" placeholder="Location">
      </div>
      <p class="text-xs text-gray-500 mt-1">Second box = when entries close. The meet gets the full standard event list; untick any you don't want below after creating.</p>
      <button id="create" class="btn bg-blue-600 text-white mt-2">Create meet</button>
    </div>

    <div id="meets" class="mt-4"></div>

<script>
const $=id=>document.getElementById(id);
const CFG=window.APP_CONFIG;
let sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } }); // avoid cross-tab navigator.locks deadlock when multiple app pages are open at once
let meets=[];
window.mountLoginWidget(sb, $('loginWidget'), {hint:"Coach sign-in."});
sb.auth.onAuthStateChange(async(_e,s)=>{ if(!s||window.__authDone===s.user.id) return; window.__authDone=s.user.id; sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } } /* rebuild: original client can wedge after an OAuth redirect */); $('login').classList.add('hidden'); $('app').classList.remove('hidden'); load(); });

$('create').onclick=async()=>{
  const name=$('mName').value.trim(), date=$('mDate').value, close=$('mClose').value;
  if(!name||!date||!close) return alert('Name, date and entries-close are required.');
  const {data:m,error}=await sb.from('meets').insert({name,meet_date:date,location:$('mLoc').value.trim(),entries_close:new Date(close).toISOString()}).select().single();
  if(error) return alert(error.message);
  const e2=await buildEvents(m.id);
  if(e2) return alert(e2.message);
  $('mName').value=$('mLoc').value=''; load();
};
// ---- Team Manager "Entry Events" report (CSV export) -> meet events, keeping Team Manager's own event numbers ----
function csvRows(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else if(ch!=='\r') cur+=ch; }
  if(cur||row.length){ row.push(cur); rows.push(row); } return rows;
}
function parseTmEvents(text){
  const events=[], skipped=[], seen={};
  for(const r of csvRows(text)){
    const f = r.length>=21 ? r.slice(12) : r.length>=9 ? r : null; if(!f) continue;
    const num=parseInt(String(f[0]).trim(),10); if(!num) continue;
    const g=String(f[2]).trim().toLowerCase(), d=String(f[3]).trim().toLowerCase();
    const gender=/^(girls|female)/.test(g)?'Girl':/^(boys|male)/.test(g)?'Boy':/^mixed/.test(g)?'Mixed':null;
    const division=d==='all'?'ALL':d.startsWith('sub')?'Sub-Gremlin':d.startsWith('grem')?'Gremlin':d.startsWith('bant')?'Bantam':d.startsWith('jun')?'Juniors':d.startsWith('you')?'Youth':d.startsWith('inter')?'Intermediates':null;
    const dist=String(f[4]).trim(), kind=String(f[5]).trim(), note=String(f[6]).trim()||null;
    if(!gender||!division||!kind){ skipped.push('#'+num); continue; }
    const relay=/relay/i.test(kind), field=!dist&&!relay;
    let code;
    if(relay) code=({'4x100m':'400','4x400m':'1600','4x800m':'3200'})[dist.toLowerCase()]||dist;
    else if(field) code=({'high jump':'HJ','long jump':'LJ','shot put':'SP','javelin':'JT','javelin throw':'JT'})[kind.toLowerCase()]||kind;
    else if(/hurdle/i.test(kind)) code=dist.replace(/m$/i,'')+'H';
    else code=dist.replace(/m$/i,'');
    const key=[code,division,gender,relay].join('|'); if(seen[key]) code=code+'#'+num; seen[key]=1;
    events.push({event_number:num, code, name:(dist?dist+' ':'')+kind, division, gender, is_relay:relay, is_field:field, note});
  }
  events.sort((a,b)=>a.event_number-b.event_number);
  return {events,skipped};
}
// Fills a meet with the standard event list (every division, boys and girls) — the same list Team Manager uses.
async function buildEvents(meetId){
  const rows=[];
  for(const d of DIVISIONS) for(const g of ['Boy','Girl'])
    for(const e of eventsFor(d.name,g)) rows.push({meet_id:meetId,code:e.code,name:e.name,division:d.name,gender:g,is_relay:!!e.relay,is_field:!!e.field});
  const {error}=await sb.from('meet_events').insert(rows);
  return error;
}

async function load(){
  const {data}=await sb.from('meets').select('*').order('meet_date',{ascending:false}); meets=data||[];
  $('meets').innerHTML=meets.map(m=>`<div class="bg-white rounded-xl shadow p-4 mb-3">
    <div class="flex flex-wrap items-center gap-2">
      <div class="font-bold flex-1">${m.name} <span class="font-normal text-gray-500">${fmtDate(m.meet_date)} · ${m.status}</span></div>
      <button class="btn bg-gray-200 text-sm" data-act="toggle" data-id="${m.id}">${m.status==='open'?'Close entries':'Reopen'}</button>
      <button class="btn bg-gray-200 text-sm" data-act="events" data-id="${m.id}">Events offered</button>
      <button class="btn bg-blue-600 text-white text-sm" data-act="import" data-id="${m.id}">Import events from Team Manager</button>
      <button class="btn bg-gray-200 text-sm" data-act="rebuild" data-id="${m.id}">Build standard events</button>
      <button class="btn bg-green-600 text-white text-sm" data-act="export" data-id="${m.id}">Hy-Tek entries</button>
      <button class="btn bg-gray-200 text-sm" data-act="summary" data-id="${m.id}">Entry list</button>
      <button class="btn bg-purple-600 text-white text-sm" data-act="results" data-id="${m.id}">Results</button>
      <button class="btn bg-red-100 text-red-700 text-sm" data-act="archive" data-id="${m.id}">Archive</button>
    </div>
    <div id="panel-${m.id}" class="mt-3"></div></div>`).join('')||'<p class="text-gray-500">No meets yet.</p>';
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.id));
}

async function act(a,id){
  const m=meets.find(x=>x.id===id);
  if(a==='toggle'){ await sb.from('meets').update({status:m.status==='open'?'closed':'open'}).eq('id',id); return load(); }
  if(a==='archive'){ if(!confirm(`Archive "${m.name}"? Entries are kept but parents won't see it.`)) return; await sb.from('meets').update({status:'archived'}).eq('id',id); return load(); }
  if(a==='events'){
    const {data:evs}=await sb.from('meet_events').select('*').eq('meet_id',id).order('division').order('gender').order('name');
    const byDiv={}; evs.forEach(e=>(byDiv[e.division+' '+e.gender]??=[]).push(e));
    $('panel-'+id).innerHTML=`<p class="text-xs text-gray-500 mb-1">Untick an event to remove it from this meet (also removes any entries in it).</p>`+
      Object.entries(byDiv).map(([k,list])=>`<div class="mb-2"><div class="font-semibold text-sm">${k}</div><div class="flex flex-wrap gap-x-4">`+
      list.map(e=>`<label class="text-sm"><input type="checkbox" checked data-ev="${e.id}"> ${e.name}</label>`).join('')+`</div></div>`).join('');
    $('panel-'+id).querySelectorAll('[data-ev]').forEach(cb=>cb.onchange=async()=>{
      if(!confirm('Remove this event from the meet?')) { cb.checked=true; return; }
      await sb.from('meet_events').delete().eq('id',cb.dataset.ev);
    });
  }
  if(a==='import'){
    $('panel-'+id).innerHTML=`<div class="border rounded p-3 bg-blue-50 text-sm">
      <p class="font-semibold mb-1">Use the meet's real events, exactly as Team Manager has them</p>
      <p class="text-xs text-gray-600 mb-2">In Team Manager: Meets → pick the meet → Events → "Entry Events" → Print → export as <b>Separated Values (CSV)</b>. Then choose that file here. The meet's event numbers, ages and mixed events come across as they are.</p>
      <input type="file" id="tmf-${id}" accept=".csv,.txt,text/csv,text/plain">
      <div id="tmp-${id}" class="mt-2"></div></div>`;
    $('tmf-'+id).onchange=async e=>{
      const f=e.target.files[0]; if(!f) return; const pv=$('tmp-'+id);
      const parsed=parseTmEvents(await f.text());
      if(!parsed.events.length) return pv.innerHTML='<span class="text-red-600">No events found in that file. Make sure it is the "Entry Events" list exported as CSV.</span>';
      pv.innerHTML=`Found <b>${parsed.events.length}</b> events (numbers ${parsed.events[0].event_number}–${parsed.events[parsed.events.length-1].event_number})`+(parsed.skipped.length?`<br><span class="text-orange-700">Skipped ${parsed.skipped.length} row(s) I couldn't read: ${parsed.skipped.slice(0,5).join(', ')}</span>`:'')+`<br><button id="tmgo-${id}" class="btn bg-purple-600 text-white text-sm mt-2">Use these events for this meet</button>`;
      $('tmgo-'+id).onclick=async()=>{
        const [{count:nEn},{count:nEv}]=await Promise.all([
          sb.from('entries').select('*',{count:'exact',head:true}).eq('meet_id',id),
          sb.from('meet_events').select('*',{count:'exact',head:true}).eq('meet_id',id)]);
        if(nEn>0) return alert(`This meet already has ${nEn} athlete entries, so its events can't be replaced without losing them.`);
        if(nEv && !confirm(`Replace this meet's ${nEv} current events with these ${parsed.events.length}? (No athletes are entered yet, so nothing is lost.)`)) return;
        if(nEv){ const {error}=await sb.from('meet_events').delete().eq('meet_id',id); if(error) return alert(error.message); }
        const {error}=await sb.from('meet_events').insert(parsed.events.map(x=>({...x,meet_id:id})));
        if(error) return alert(error.message);
        pv.innerHTML=`Saved ${parsed.events.length} events.`; setTimeout(load,1200);
      };
    };
    return;
  }
  if(a==='rebuild'){
    const [{count:nEv},{count:nEn}]=await Promise.all([
      sb.from('meet_events').select('*',{count:'exact',head:true}).eq('meet_id',id),
      sb.from('entries').select('*',{count:'exact',head:true}).eq('meet_id',id)]);
    if(nEn>0) return alert(`"${m.name}" already has ${nEn} athlete entries, so its events can't be rebuilt without losing them. Ask before doing that.`);
    if(!confirm(nEv?`Replace this meet's ${nEv} events with the standard event list? (No athletes are entered yet, so nothing is lost.)`:'Fill this meet with the standard event list?')) return;
    if(nEv){ const {error}=await sb.from('meet_events').delete().eq('meet_id',id); if(error) return alert(error.message); }
    const err=await buildEvents(id); if(err) return alert(err.message);
    alert('Events built from the standard list.'); return load();
  }
  if(a==='results') return resultsPanel(m);
  if(a==='summary'||a==='export'){
    // The server returns at most 1,000 rows per request, and a big meet (the Invitational) has 1,000+ athletes and several thousand entries,
    // so every lookup below is paged until it runs dry.
    const pageAll=async(mk)=>{ const all=[]; for(let f=0;;f+=1000){ const {data,error}=await mk().range(f,f+999); if(error){ alert(error.message); break; } all.push(...(data||[])); if(!data||data.length<1000) break; } return all; };
    const evs=await pageAll(()=>sb.from('meet_events').select('*').eq('meet_id',id).order('id'));
    const ens=await pageAll(()=>sb.from('entries').select('*').eq('meet_id',id).order('id'));
    // Every athlete on every team that entered this meet (the complete roster), verified only.
    const entRegIds=new Set(ens.map(n=>n.registration_id)), regs=[];
    const teamsIn=new Set();
    for(let i=0;i<[...entRegIds].length;i+=150){
      const {data:part}=await sb.from('registrations').select('team_code').in('id',[...entRegIds].slice(i,i+150)); (part||[]).forEach(x=>teamsIn.add(x.team_code));
    }
    for(const tc of teamsIn){ regs.push(...await pageAll(()=>sb.from('registrations').select('id,first_name,last_name,gender,dob,division,age_on_dec31,team_code').eq('team_code',tc).eq('status','verified').order('id'))); }
    const R=Object.fromEntries(regs.map(r=>[r.id,r])), E=Object.fromEntries(evs.map(e=>[e.id,e]));
    const rows=ens.map(n=>({r:R[n.registration_id],e:E[n.meet_event_id],mark:n.seed_mark,rt:n.relay_team,leg:n.leg})).filter(x=>x.r&&x.e);
    const rosterOnly=regs.filter(r=>!entRegIds.has(r.id));
    if(a==='summary'){
      const byEv={}; rows.forEach(x=>(byEv[`${x.e.division} ${x.e.gender} — ${x.e.name}`]??=[]).push(`${x.r.first_name} ${x.r.last_name}${x.mark?' ('+x.mark+')':''}`));
      $('panel-'+id).innerHTML=`<p class="text-sm font-semibold">${rows.length} entries, ${new Set(rows.map(x=>x.r.id)).size} athletes</p>`+
        Object.entries(byEv).sort().map(([k,v])=>`<div class="text-sm"><b>${k}</b>: ${v.join(', ')}</div>`).join('');
    } else {
      if(!rows.length) return alert('No entries yet.');
      const txt=hytekEntries(rows,CFG,rosterOnly);
      const a2=document.createElement('a'); a2.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
      a2.download=`${m.name.replace(/[^\w]+/g,'_')}_ALL_TEAMS_entries_and_roster.txt`; a2.click();
    }
  }
}

async function resultsPanel(m){
  const p=$('panel-'+m.id);
  const {count}=await sb.from('results').select('*',{count:'exact',head:true}).eq('meet_id',m.id);
  p.innerHTML=`<div class="border rounded p-3 bg-purple-50">
    <p class="text-sm mb-2"><b>${count||0}</b> results stored for this meet. <a class="underline" href="results.html?meet=${m.id}" target="_blank">View</a></p>
    <p class="text-sm font-semibold">Upload the results file</p>
    <p class="text-xs text-gray-600 mb-1">Either the semicolon-delimited Meet Manager export, or your Team Manager's own "TCL01-01.tcl" results file (auto-detected). The semicolon-delimited file keeps every team in the meet, so the results page can show the whole conference. (The .tcl format only ever contains your own team.)</p>
    <input type="file" id="rf-${m.id}" accept=".txt,.csv,.sd3,.tcl,text/plain" class="text-sm">
    <label class="text-xs ml-2"><input type="checkbox" id="rall-${m.id}" checked> keep all teams (semicolon format)</label>
    <div id="rprev-${m.id}" class="text-sm mt-2"></div>
    <hr class="my-3">
    <p class="text-sm font-semibold">Add one result by hand</p>
    <div class="grid grid-cols-2 gap-1 mt-1 text-sm">
      <select id="ra-${m.id}" class="border rounded p-1 col-span-2"><option value="">Athlete…</option></select>
      <select id="re-${m.id}" class="border rounded p-1"><option value="">Event…</option></select>
      <input id="rm-${m.id}" class="border rounded p-1" placeholder="Mark (14.52 / 1:05.3 / 3.45)">
      <input id="rp-${m.id}" type="number" class="border rounded p-1" placeholder="Place (optional)">
      <button id="rsave-${m.id}" class="btn bg-purple-600 text-white text-sm">Save result</button>
    </div>
    <hr class="my-3">
    <button id="rdel-${m.id}" class="btn bg-red-100 text-red-700 text-sm">Delete all results for this meet</button>
  </div>`;
  const {data:regs}=await sb.from('registrations').select('id,first_name,last_name,gender,division').eq('status','verified').order('last_name');
  const sa=$('ra-'+m.id); regs.forEach(r=>sa.add(new Option(`${r.last_name}, ${r.first_name} (${r.division} ${r.gender})`,r.id)));
  sa.onchange=()=>{ const r=regs.find(x=>x.id===sa.value); const se=$('re-'+m.id); se.innerHTML='<option value="">Event…</option>';
    if(r) eventsFor(r.division,r.gender).filter(e=>!e.relay).forEach(e=>se.add(new Option(e.name,e.code))); };
  $('rsave-'+m.id).onclick=async()=>{
    const r=regs.find(x=>x.id===sa.value), code=$('re-'+m.id).value, mark=$('rm-'+m.id).value.trim();
    if(!r||!code||!mark) return alert('Athlete, event and mark are required.');
    const ev=STANDARD_EVENTS.find(e=>e.code===code&&!e.relay), isTime=!ev.field;
    const {error}=await sb.from('results').insert({meet_id:m.id,registration_id:r.id,athlete_name:`${r.first_name} ${r.last_name}`,gender:r.gender,division:r.division,
      event_code:code,event_name:ev.name,is_relay:false,round:'F',mark,mark_value:markToValue(mark,isTime,'M'),is_time:isTime,place:parseInt($('rp-'+m.id).value)||null,source:'manual'});
    if(error) return alert(error.message); $('rm-'+m.id).value=$('rp-'+m.id).value=''; resultsPanel(m);
  };
  $('rdel-'+m.id).onclick=async()=>{ if(!confirm(`Delete ALL results for "${m.name}"? This can't be undone.`)) return;
    await sb.from('results').delete().eq('meet_id',m.id); resultsPanel(m); };
  $('rf-'+m.id).onchange=async ev=>{
    const text=await ev.target.files[0].text();
    const pv=$('rprev-'+m.id);
    const isTeamFile = window.looksLikeHytekTeamFile(text);
    let rows, summary;
    if(isTeamFile){
      const parsed=window.parseHytekTeamFile(text, regs);
      rows=parsed.rows.map(r=>({registration_id:r.registration_id, athlete_name:r.athlete_name, gender:r.gender, division:r.division,
        event_code:r.event_name, event_name:r.event_name, is_relay:false, round:r.round, mark:r.mark, mark_value:r.mark_value,
        is_time:r.is_time, place:r.place, source:'hytek-tm'}));
      if(!rows.length) return pv.innerHTML='<span class="text-red-600">No results found in that .tcl file.</span>';
      summary=`Found <b>${rows.length}</b> results${parsed.meetName?` from "${parsed.meetName}"`:''} for team ${parsed.teamCode||CFG.TEAM_CODE} (Team Manager .tcl format detected).`
        +(parsed.unmatched.length?`<br><span class="text-orange-700">Not matched to a registered athlete (still saved, but won't link to their record): ${parsed.unmatched.join(', ')}</span>`:'');
    } else {
      const parsed=parseHytekResults(text,CFG,regs,[],$('rall-'+m.id).checked);
      if(!parsed.rows.length) return pv.innerHTML='<span class="text-red-600">No results found in that file for '+CFG.TEAM_CODE+'.</span>';
      rows=parsed.rows;
      summary=`Found <b>${parsed.rows.length}</b> results${parsed.header?` from "${parsed.header.meet}"`:''} (${parsed.skippedOtherTeams} other-team rows skipped).`
        +(parsed.unmatched.length?`<br><span class="text-orange-700">Not matched to a registered athlete (still saved, but won't link to their record): ${parsed.unmatched.join(', ')}</span>`:'');
    }
    pv.innerHTML=summary+`<br><button id="rgo-${m.id}" class="btn bg-purple-600 text-white text-sm mt-2">Save these results</button>`;
    $('rgo-'+m.id).onclick=async()=>{
      const toSave=rows.map(r=>({...r,meet_id:m.id}));
      const {error}=await sb.from('results').insert(toSave);
      pv.innerHTML=error?`<span class="text-red-600">${error.message}</span>`:`Saved ${toSave.length} results.`; if(!error) setTimeout(()=>resultsPanel(m),1200);
    };
  };
}

// Hy-Tek Meet Manager: D records (individual entries) + Q records (relays, up to 8 names per team letter)
function hytekEntries(rows,cfg,rosterOnly){
  // Follows Meet Manager's own "Import Entries from a Semi-Colon Delimited File" spec (Help > File Menu > Import):
  //   I = athlete info (roster) record, D = individual entry (20 fields), Q = relay entry (15 fields + 8 fields per runner).
  // Field 11 of D and field 7 of Q is the EVENT CODE (100, 3000, 80H, LJ, 400...), not the event number.
  // ALL teams entered in the meet go into one file; each athlete/relay carries its own team code + name.
  const c=(s,n)=>String(s??'').replace(/[;\r\n]/g,' ').trim().slice(0,n);
  const tcode=r=>c(r.team_code||cfg.TEAM_CODE||'UNA',4).toUpperCase();
  const tname=r=>{ const t=(window.VYC_TEAMS||[]).find(x=>x.code===tcode(r)); return c(t?t.name:(cfg.CLUB_NAME||'Unattached'),30); };
  const ath=r=>[c(r.last_name,20),c(r.first_name,20),'',r.gender==='Girl'?'F':'M',fmtDate(r.dob),tcode(r),tname(r),String(r.age_on_dec31??'')];
  // Marks: times as-is; feet-inches like 12' 4" become 12-04 with measure E (English); everything else metric.
  const mk=m=>{ m=String(m??'').trim(); const x=/^(\d+)\s*(?:'|-)\s*(\d+(?:\.\d+)?)\s*"?$/.exec(m); return x?{m:`${x[1]}-${String(x[2]).padStart(2,'0')}`,u:'E'}:{m:c(m,11),u:'M'}; };
  rows=[...rows].sort((p,q)=>tcode(p.r).localeCompare(tcode(q.r)));
  const out=[];
  rows.filter(x=>!x.e.is_relay).forEach(x=>{ const k=mk(x.mark); out.push(['D',...ath(x.r),'',c(x.e.code,10),k.m,k.u,'','','','','','',''].join(';')); });
  const relays={}; rows.filter(x=>x.e.is_relay).forEach(x=>(relays[`${tcode(x.r)}|${x.e.code}|${x.e.division}|${x.e.gender}|${x.rt||''}`]??=[]).push(x));
  for(const [k,items] of Object.entries(relays)){
    const [tc,evCode,div,g,rt]=k.split('|'); const age=div==='ALL'?18:(DIVISIONS.find(d=>d.name===div)?.max??''); const tn=tname(items[0].r);
    items.sort((p,q)=>(p.leg??99)-(q.leg??99));           // runners in leg order (legs 1-4, then alternates)
    for(let i=0,L=0;i<items.length;i+=8,L++){
      const runners=items.slice(i,i+8).flatMap(({r})=>[c(r.last_name,20),c(r.first_name,20),'',r.gender==='Girl'?'F':'M',fmtDate(r.dob),String(r.age_on_dec31??''),'','']);
      out.push(['Q',tc,tn,rt||String.fromCharCode(65+L),g==='Girl'?'F':g==='Boy'?'M':'X',String(age),evCode,'','M','','','','','','',...runners].join(';'));
    }
  }
  // Complete roster: athletes on the participating teams with no entries yet go out as I (information) records.
  (rosterOnly||[]).sort((p,q)=>tcode(p).localeCompare(tcode(q))||(p.last_name+p.first_name).localeCompare(q.last_name+q.first_name)).forEach(r=>out.push(['I',...ath(r)].join(';')));
  return out.join('\r\n')+'\r\n';
}
