<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="config.js"></script><script src="shared.js"></script><script src="events.js"></script><script src="results.js"></script><script src="league-records.js"></script>
<style>
.btn{padding:.5rem .9rem;border-radius:.5rem;font-weight:600}
.seg{padding:.5rem .9rem;font-size:.875rem;cursor:pointer;background:#fff}
.seg.active{background:var(--brand);color:#fff}
.rec-row td{padding-top:.35rem;padding-bottom:.35rem}
.rec-medal{display:inline-block;width:1.5rem;text-align:center}
  details.meetwin{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px;padding:10px 14px}
  details.meetwin>summary{cursor:pointer;padding:6px 0;list-style:revert}
  details.meetwin .meetbody{max-height:65vh;overflow-y:auto;margin-top:8px;padding:8px;border:1px solid #e5e7eb;border-radius:8px;background:#f9fafb}
  .heatblk{margin:8px 0 6px}
  .heathead{font-size:12px;font-weight:700;color:#1d4ed8;background:#eff6ff;border-radius:6px;padding:3px 8px;margin-bottom:2px}
  .bdg{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:middle}
  .bq{background:#dcfce7;color:#166534}
  .bcr{background:#fef3c7;color:#92400e}
  .stdline td{font-size:11px;color:#166534;background:#f0fdf4;padding:2px 6px;border-top:2px dashed #86efac;font-weight:600}
</style>
</head><body class="bg-gray-50 text-gray-900"><header class="topnav"><div class="topnav-inner">
  <a class="brand" href="home.html">VYC <b>Track &amp; Field</b></a>
  <nav>
    <a href="home.html">Home</a>
    <a href="index.html">Register</a>
    <a href="coach.html">Coach Dashboard</a>

</div></header>
<div class="max-w-3xl mx-auto p-4">
  <h1 class="text-2xl font-bold" id="club"></h1>
  <p class="text-gray-600 mb-3">Results &amp; Records</p>
  <div id="login" class="bg-white rounded-xl shadow p-4">
    <div id="loginWidget"></div>
  </div>
  <div id="app" class="hidden">
    <div class="flex rounded-lg overflow-hidden border text-sm mb-3 w-fit">
      <button id="modeSeason" class="seg">Season Rankings</button>
      <button id="modeMeet" class="seg">Meet Results</button>
      <button id="modeRecords" class="seg">🏆 All-Time Records</button>
    </div>

    <div id="meetPicker" class="hidden flex flex-wrap items-center gap-2 mb-2">
      <select id="meet" class="border rounded p-2 flex-1"></select>
      <label class="text-xs text-gray-600 flex items-center gap-1"><input type="checkbox" id="meetRecord"> meet record (best ever, all years)</label>
    </div>

    <div class="flex flex-wrap gap-2 mb-2">
      <select id="evt" class="border rounded p-2"><option value="">All events</option></select>
      <select id="div" class="border rounded p-2"><option value="">All divisions</option></select>
      <select id="gen" class="border rounded p-2"><option value="">Boys &amp; Girls</option><option>Boy</option><option>Girl</option></select>
      <select id="conf" class="border rounded p-2"><option value="">Both leagues</option><option value="East">Eastern League</option><option value="West">Western League</option></select>
      <input id="q" class="border rounded p-2 flex-1" placeholder="Search name">
      <label id="qOnlyWrap" class="text-xs text-gray-700 flex items-center gap-1"><input type="checkbox" id="qOnly"> only athletes who met the qualifying standard</label>
      <button id="pdfBtn" type="button" class="border rounded p-2 px-3 bg-gray-800 text-white font-semibold">Download PDF</button>
    </div>
    <p id="hint" class="text-xs text-gray-500 mb-2"></p>
    <div id="list"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const CFG=window.APP_CONFIG;
$('club').textContent=CFG.CLUB_NAME;
let sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } }); // avoid cross-tab navigator.locks deadlock when multiple app pages are open at once
let allResults=[], seasonBest=[], meets=[], mode='season';
let lastGroups=[];
DIVISIONS.forEach(d=>$('div').add(new Option(d.name,d.name)));

window.mountLoginWidget(sb, $('loginWidget'), {hint:"Sign in with the email you registered with."});

$('modeSeason').onclick=()=>setMode('season');
$('modeMeet').onclick=()=>setMode('meet');
$('modeRecords').onclick=()=>setMode('records');
function setMode(m){
  mode=m;
  ['modeSeason','modeMeet','modeRecords'].forEach(id=>$(id).classList.toggle('active', id==='mode'+m[0].toUpperCase()+m.slice(1)));
  $('meetPicker').classList.toggle('hidden', mode!=='meet');
  $('qOnlyWrap').classList.toggle('hidden', mode!=='season');
  render();
}

sb.auth.onAuthStateChange(async(_e,s)=>{ if(!s||window.__authDone===s.user.id) return; window.__authDone=s.user.id; sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } } /* rebuild: original client can wedge after an OAuth redirect */); $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  const {data:m}=await sb.from('meets').select('id,name,meet_date,is_championship').order('meet_date',{ascending:false});
  meets=m||[];
  $('meet').innerHTML='<option value="">All meets — each in its own window</option>'+meets.map(m=>`<option value="${m.id}">${m.name} — ${fmtDate(m.meet_date)}</option>`).join('');
  const want=new URLSearchParams(location.search).get('meet'); if(want){ $('meet').value=want; mode='meet'; }
  await loadAll();
  setMode(mode);
  ['meet','meetRecord','evt','div','gen','conf','qOnly'].forEach(i=>$(i).onchange=render); $('q').oninput=render;
});

async function pageAll(mk){ const all=[]; for(let f=0;;f+=1000){ const {data,error}=await mk().range(f,f+999); if(error){ console.error(error); break; } all.push(...(data||[])); if(!data||data.length<1000) break; } return all; }
let stds=[], recs=[];
async function loadAll(){
  // The server returns at most 1,000 rows per request and a league season has thousands of results, so page through everything.
  const [rr,sb2,ss,rc]=await Promise.all([
    pageAll(()=>sb.from('results').select('*, meets(name,meet_date)').order('id')),
    pageAll(()=>sb.from('season_best').select('*').order('id')),
    pageAll(()=>sb.from('qualifying_standards').select('*').order('id')),
    pageAll(()=>sb.from('conference_records').select('*').order('id'))
  ]);
  stds=ss; recs=rc;
  const missing=[...new Set([...rr,...sb2].filter(r=>!r.team_code && r.registration_id).map(r=>r.registration_id))];
  let regsById={};
  const chunks=[]; for(let i=0;i<missing.length;i+=150) chunks.push(missing.slice(i,i+150));
  (await Promise.all(chunks.map(c=>sb.from('registrations').select('id,team_code').in('id',c)))).forEach(({data:regs})=>(regs||[]).forEach(r=>regsById[r.id]=r)); // in parallel — sequential lookups made the page take ~20 seconds
  allResults=attachConference(rr.map(r=>({...r,meet_name:r.meets?.name,meet_date:r.meets?.meet_date})),regsById);
  seasonBest=attachConference(sb2,regsById);
}

// Rows for the currently selected mode, before the division/gender/event/conference/search filters.
function baseRows(){
  if(mode==='season'||mode==='records') return seasonBest;
  const m=meets.find(x=>x.id===$('meet').value); if(!m) return allResults;
  if($('meetRecord').checked) return allResults.filter(r=>r.meet_name===m.name);
  return allResults.filter(r=>r.meet_id===m.id);
}

function populateEventFilter(){
  const seen=new Set(baseRows().map(r=>r.event_name).filter(Boolean));
  const order=(window.STANDARD_EVENTS||[]).map(e=>e.name);
  const names=[...seen].sort((a,b)=>{ const ia=order.indexOf(a), ib=order.indexOf(b); if(ia===-1&&ib===-1) return a.localeCompare(b); if(ia===-1) return 1; if(ib===-1) return -1; return ia-ib; });
  const keep=$('evt').value;
  $('evt').innerHTML='<option value="">All events</option>'+names.map(n=>`<option value="${n}">${n}</option>`).join('');
  if(names.includes(keep)) $('evt').value=keep;
}

function render(){
  populateEventFilter();
  const d=$('div').value, g=$('gen').value, ev=$('evt').value, q=$('q').value.toLowerCase(), conf=$('conf').value;
  let rs=baseRows().filter(r=>(!d||r.division===d)&&(!g||r.gender===g)&&(!ev||r.event_name===ev)&&(!q||(r.athlete_name+' '+(r.relay_runners||'')).toLowerCase().includes(q)));
  const bestPerAthlete = mode!=='meet';
  const isMeetRecord = mode==='meet' && $('meetRecord').checked;
  const cap = mode==='records' ? 1 : (mode==='season' ? 50 : null);
  if(mode==='meet' && !$('meet').value){ renderAllMeets(d,g,ev,q,conf); return; }
  if(mode==='meet' && !isMeetRecord){ renderSingleMeet(conf?rs.filter(r=>r.conference===conf):rs); return; }
  const qOnly = mode==='season' && $('qOnly').checked;
  const groups=rankResults(rs,bestPerAthlete||isMeetRecord,conf||null, mode==='season'?null:cap);
  // Season rankings keep the top-50 club cap, but the qualifier count is taken from the FULL ranked list, and "only qualified" shows every qualifier at its true rank.
  groups.forEach(g=>{
    const f=g.rows[0]; g.std=f?stdFor(f):null; g.rec=f?recFor(f):null; g.lrecs=f?leagueRecs(f):[];
    const ranked=g.rows.filter(r=>r.mark_value!=null), rest=g.rows.filter(r=>r.mark_value==null);
    ranked.forEach((r,i)=>{ r._rank=i+1; r.q=isQ(r,g.std); });
    g.qCount=ranked.filter(r=>r.q).length; g.total=ranked.length;
    let show=ranked; if(mode==='season'&&!qOnly) show=ranked.slice(0,50); if(qOnly) show=ranked.filter(r=>r.q);
    g.rows=show.concat(qOnly?[]:rest); g.ref=refText(g);
  });
  const shown=qOnly?groups.filter(g=>g.rows.length):groups;
  lastGroups=shown;
  $('hint').textContent =
    mode==='records' ? 'The single best mark ever recorded per event, division, and gender — the club record book. "Q" = met the qualifying standard.' :
    mode==='season' ? (qOnly?'Only athletes who met the qualifying standard, at their true season rank.':'Best mark per athlete, top 50 per event/division/gender. "Q" = met the qualifying standard; the green line marks where the standard cuts off.') :
    isMeetRecord ? 'Best mark ever posted at this meet (any year it has been run).' :
    'Full results for this meet.';

  $('list').innerHTML=shown.map(gp=>{
    let lineDone=false;
    const rowsHtml=gp.rows.map(r=>{
      let sep='';
      if(mode==='season'&&!qOnly&&gp.std&&gp.qCount>0&&r.mark_value!=null&&!r.q&&!lineDone){ lineDone=true; sep=`<tr class="stdline"><td colspan="4">Qualifying standard ${fmtStd(gp.std,gp)} — everyone above this line met it</td></tr>`; }
      return sep+`<tr class="border-t rec-row">
      <td class="py-1 w-8 text-gray-500">${mode==='records'?'':(r.mark_value!=null?r._rank:'')}</td>
      <td class="py-1">${r.athlete_name}${r.team_code?` <span class="text-xs text-gray-400">${r.team_code}</span>`:''}${r.relay_runners?`<div class="text-xs text-gray-500">${r.relay_runners}</div>`:''}</td>
      <td class="py-1 font-mono text-right font-semibold">${r.mark}${r.wind?` <span class="text-xs text-gray-400">w${r.wind}</span>`:''}${r.q?' <span class="bdg bq" title="Met the qualifying standard">Q</span>':''}</td>
      <td class="py-1 text-right text-gray-500 text-xs">${(mode==='season'||mode==='records')?`${r.meet_name||''}`:((r.overall_place||r.place)?`${r.overall_place||r.place}${['st','nd','rd'][(r.overall_place||r.place)-1]||'th'} overall`:'')}</td></tr>`; }).join('');
    const ref=refHtml(gp);
    return `<div class="bg-white rounded-xl shadow p-3 mb-3">
    <div class="font-bold flex items-center gap-2">${mode==='records'?'<span class=\"rec-medal\">🏅</span>':''}${gp.division} ${gp.gender==='Boy'?'Boys':gp.gender==='Girl'?'Girls':gp.gender} — ${gp.event}</div>
    ${ref?`<div class="text-xs text-gray-500 mt-0.5">${ref}${gp.std&&mode!=='records'?` &nbsp;·&nbsp; <b class="text-green-700">${gp.qCount} of ${gp.total} met the standard</b>`:''}</div>`:''}
    <table class="w-full text-sm mt-1">${rowsHtml}</table></div>`; }).join('')
    ||'<p class="text-gray-500">'+(qOnly?'No athletes have met the standard for these filters yet.':'No results yet.')+'</p>';
}
// ---------- Meet results, always sectioned by HEAT (like Meet Manager's results): division/gender/event -> round -> heat, places are within the heat ----------
const DIV_AGES={'Sub-Gremlin':[5,6],'Gremlin':[7,8],'Bantam':[9,10],'Juniors':[11,12],'Youth':[13,14],'Intermediates':[15,18]};
function stdFor(r){ if(r.is_relay||r.mark_value==null) return null; const a=DIV_AGES[r.division]; if(!a) return null; const [lo,hi]=r.division==='Intermediates'?[0,99]:a; // Team Manager's standards use "Open" (0-99) for the oldest division
  return stds.find(s=>s.gender===r.gender&&s.event_code===r.event_code&&!s.is_relay&&s.age_low===lo&&s.age_high===hi)||null; }
function recFor(r){ const a=DIV_AGES[r.division]; if(!a) return null; return recs.find(x=>x.gender===r.gender&&x.event_code===r.event_code&&!!x.is_relay===!!r.is_relay&&x.age_low===a[0]&&x.age_high===a[1])||null; }
const better=(isTime,a,b)=>isTime?a<b:a>b;
const isQ=(r,std)=>!!std&&!r.is_relay&&r.mark_value!=null&&(r.mark_value===std.mark_value||better(r.is_time,r.mark_value,std.mark_value));
function leagueRecs(f){ const a=DIV_AGES[f.division]; if(!a) return [];
  return [['East','Eastern'],['West','Western']].map(([k,nm])=>{ const x=((window.LEAGUE_RECORDS||{})[k]||[]).find(x=>x.gender===f.gender&&x.event_code===f.event_code&&!!x.is_relay===!!f.is_relay&&x.age_low===a[0]&&x.age_high===a[1]); return x?{nm,rec:x}:null; }).filter(Boolean); }
const lrecTxt=(x)=>`${x.rec.mark_text||''} ${x.rec.holder}${x.rec.team?`, ${x.rec.team}`:''}${x.rec.rec_year?` (${x.rec.rec_year})`:''}`;
function recLine(rec){ return rec?`Conference record: ${rec.mark_text||''} ${rec.is_relay?(rec.relay_names||rec.holder):rec.holder}${rec.team?`, ${rec.team}`:''}${rec.rec_year?` (${rec.rec_year})`:''}`:''; }
function refText(f){ return [ f.std?`Qualifying standard: ${fmtStd(f.std,f)}`:'', recLine(f.rec), ...(f.lrecs||[]).map(x=>`${x.nm} League record: ${lrecTxt(x)}`) ].filter(Boolean).join('   |   '); }
function refHtml(f){ return [ f.std?`Qualifying standard: <b>${fmtStd(f.std,f)}</b>`:'', f.rec?`Conference record: <b>${f.rec.mark_text||''}</b> ${f.rec.is_relay?(f.rec.relay_names||f.rec.holder):f.rec.holder}${f.rec.team?`, ${f.rec.team}`:''}${f.rec.rec_year?` (${f.rec.rec_year})`:''}`:'', ...(f.lrecs||[]).map(x=>`${x.nm} League record: <b>${x.rec.mark_text||''}</b> ${x.rec.holder}${x.rec.team?`, ${x.rec.team}`:''}${x.rec.rec_year?` (${x.rec.rec_year})`:''}`) ].filter(Boolean).join(' &nbsp;·&nbsp; '); }
const fmtStd=(s,r)=>r.is_time?fmtTimeVal(s.mark_value):fmtFieldVal(s.mark_value);
function fmtTimeVal(sec){ if(sec>=60){ const m=Math.floor(sec/60); return m+':'+(sec-m*60).toFixed(2).padStart(5,'0'); } return sec.toFixed(2); }
function fmtFieldVal(m){ const inch=m/0.0254; const ft=Math.floor(inch/12+1e-9); const i=inch-ft*12; return ft+"-"+(Math.round(i*4)/4).toFixed(2).replace(/\.00$/,'').padStart(2,'0'); }
function heatBlocks(rows,meet){
  const evOrder=(window.STANDARD_EVENTS||[]).map(e=>e.name), divOrder=DIVISIONS.map(d=>d.name);
  const groups={}; rows.forEach(r=>{ (groups[[r.division,r.gender,r.event_name].join('|')]??=[]).push(r); });
  const list=Object.values(groups).sort((A,B)=>{ const a=A[0],b=B[0]; const ea=evOrder.indexOf(a.event_name), eb=evOrder.indexOf(b.event_name);
    return ((ea<0?999:ea)-(eb<0?999:eb))||(divOrder.indexOf(a.division)-divOrder.indexOf(b.division))||String(a.gender).localeCompare(String(b.gender)); });
  const pdfGroups=[];
  const html=list.map(g=>{
    const f=g[0], label=`${f.division} ${f.gender==='Boy'?'Boys':f.gender==='Girl'?'Girls':f.gender} — ${f.event_name}`;
    const std=stdFor(f), rec=recFor(f);
    const lrecs=leagueRecs(f); const ref=refHtml({...f,std,rec,lrecs});
    const rounds=[...new Set(g.map(r=>r.round||'F'))].sort((a,b)=>(a==='P'?0:1)-(b==='P'?0:1));
    const body=rounds.map(rd=>{
      const rr=g.filter(r=>(r.round||'F')===rd); const heats=[...new Set(rr.map(r=>r.heat||0))].sort((a,b)=>a-b); const nHeats=heats.filter(h=>h).length;
      return heats.map(h=>{
        const hr=rr.filter(r=>(r.heat||0)===h).sort((a,b)=>((a.place>0?a.place:9999)-(b.place>0?b.place:9999))||String(a.athlete_name).localeCompare(String(b.athlete_name)));
        hr.forEach(r=>{ r.q=isQ(r,std); });
        const title=`${rd==='P'?'Prelims':'Finals'}${h?` — Heat ${h}${nHeats>1?' of '+nHeats:''}`:''}`;
        pdfGroups.push({division:f.division,gender:f.gender,event:`${f.event_name} — ${title}`,rows:hr,ref:refText({...f,std,rec,lrecs})});
        return `<div class="heatblk"><div class="heathead">${title}</div><table class="w-full text-sm">${hr.map(r=>{
          const badges=[]; r.q=isQ(r,std); if(r.q) badges.push('<span class="bdg bq" title="Met the qualifying standard">Q</span>');
          if(meet&&meet.is_championship&&rec&&r.mark_value!=null&&better(r.is_time,r.mark_value,rec.mark_value)) badges.push('<span class="bdg bcr" title="New conference record — conference records can only be broken at conference championship meets">CR</span>');
          return `<tr class="border-t"><td class="py-1 w-8 text-gray-500">${r.place>0?r.place:''}</td><td class="py-1">${r.athlete_name}${r.team_code?` <span class="text-xs text-gray-400">${r.team_code}</span>`:''}${r.relay_runners?`<div class="text-xs text-gray-500">${r.relay_runners}</div>`:''}</td><td class="py-1 font-mono text-right font-semibold">${r.mark}${r.wind?` <span class="text-xs text-gray-400">w${r.wind}</span>`:''} ${badges.join(' ')}</td></tr>`; }).join('')}</table></div>`;
      }).join('');
    }).join('');
    return `<div class="bg-white rounded-xl shadow p-3 mb-3"><div class="font-bold">${label}</div>${ref?`<div class="text-xs text-gray-500 mt-0.5">${ref}</div>`:''}${body}</div>`;
  }).join('');
  return {html,pdfGroups};
}
function renderSingleMeet(rs){
  const m=meets.find(x=>x.id===$('meet').value);
  const {html,pdfGroups}=heatBlocks(rs,m); lastGroups=pdfGroups;
  $('hint').textContent='Results by heat — places are within each heat. "Q" = met the qualifying standard'+(m&&m.is_championship?'; "CR" = new conference record (this is a conference championship meet).':'. Conference records can only be broken at conference championship meets.');
  $('list').innerHTML=html||'<p class="text-gray-500">No results match these filters.</p>';
}
// "All meets" view: every meet that has results gets its own window (collapsible, own scroll). Any signed-in coach or parent, any team, sees all of them.
const openMeets=new Set();
function meetRows(m,d,g,ev,q){
  return allResults.filter(r=>r.meet_id===m.id&&(!d||r.division===d)&&(!g||r.gender===g)&&(!ev||r.event_name===ev)&&(!q||(r.athlete_name+' '+(r.relay_runners||'')).toLowerCase().includes(q)));
}
function fillMeetWindow(det,d,g,ev,q,conf){
  const m=meets.find(x=>x.id===det.dataset.m); const box=det.querySelector('.meetbody'); if(!m||!box) return;
  const rows=meetRows(m,d,g,ev,q).filter(r=>!conf||r.conference===conf);
  box.innerHTML=heatBlocks(rows,m).html||'<p class="text-gray-500 p-2">No results match these filters.</p>';
}
function renderAllMeets(d,g,ev,q,conf){
  lastGroups=[];
  $('hint').textContent='Every meet, each in its own window — open one to see its results by heat. Filters above apply to all of them.';
  const withResults=meets.filter(m=>allResults.some(r=>r.meet_id===m.id));
  if(!withResults.length){ $('list').innerHTML='<p class="text-gray-500">No results have been uploaded for any meet yet.</p>'; return; }
  $('list').innerHTML=withResults.map(m=>{ const n=meetRows(m,d,g,ev,q).filter(r=>!conf||r.conference===conf).length; return `<details class="meetwin" data-m="${m.id}" ${openMeets.has(m.id)?'open':''}><summary><span class="font-bold">${m.name}</span> ${m.is_championship?'<span class="bdg bcr">Conference Championship</span>':''} <span class="text-gray-500 text-sm">— ${fmtDate(m.meet_date)} · ${n} results</span></summary><div class="meetbody"></div></details>`; }).join('');
  document.querySelectorAll('#list details.meetwin').forEach(det=>{
    if(det.open) fillMeetWindow(det,d,g,ev,q,conf);
    det.addEventListener('toggle',()=>{ if(det.open){ openMeets.add(det.dataset.m); fillMeetWindow(det,d,g,ev,q,conf); } else openMeets.delete(det.dataset.m); });
  });
}
$('pdfBtn').onclick=async()=>{
  if(mode==='meet' && !$('meet').value) return alert('Pick one meet from the meet list first — the PDF is made one meet at a time.');
  if(!lastGroups.length) return alert('Nothing to put in a PDF yet — pick a meet or change the filters first.');
  const meetName = mode==='meet' ? ($('meet').selectedOptions[0]?.textContent||'Meet') : '';
  const title = mode==='meet' ? meetName+' - Results' : mode==='records' ? 'All-Time Records' : 'Season Rankings';
  const bits=[ $('div').value, $('gen').value?($('gen').value==='Boy'?'Boys':'Girls'):'', $('evt').value, $('conf').value?$('conf').value+'ern League':'' ].filter(Boolean);
  const bytes=await window.resultsPdf(lastGroups,{title, subtitle:bits.length?bits.join('  |  '):'All divisions, boys & girls'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
  a.download=title.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.pdf'; a.click();
};
</script></body></html>
