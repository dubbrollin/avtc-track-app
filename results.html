<style>
.btn{padding:.5rem .9rem;border-radius:.5rem;font-weight:600}
.seg{padding:.5rem .9rem;font-size:.875rem;cursor:pointer;background:#fff}
.seg.active{background:var(--brand);color:#fff}
.rec-row td{padding-top:.35rem;padding-bottom:.35rem}
.rec-medal{display:inline-block;width:1.5rem;text-align:center}
  details.meetwin{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px;padding:10px 14px}
  details.meetwin>summary{cursor:pointer;padding:6px 0;list-style:revert}
  details.meetwin .meetbody{max-height:65vh;overflow-y:auto;margin-top:8px;padding:8px;border:1px solid #e5e7eb;border-radius:8px;background:#f9fafb}
  .heatblk{margin:8px 0 6px}
  .heathead{font-size:12px;font-weight:700;color:#1d4ed8;background:#eff6ff;border-radius:6px;padding:3px 8px;margin-bottom:2px}
  .bdg{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:middle}
  .bq{background:#dcfce7;color:#166534}
  .bcr{background:#fef3c7;color:#92400e}
  .livebar{background:#fff;border:1px solid #fecaca;border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .livedot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#dc2626;margin-right:6px;vertical-align:middle;animation:livepulse 1.6s ease-in-out infinite}
  @keyframes livepulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){.livedot{animation:none}}
  .liveposted{font-size:11px;color:#6b7280;margin:0 0 3px 4px}
  .bnew{background:#fee2e2;color:#b91c1c}
  tr.mine td{background:#fef9c3}
  .stdline td{font-size:11px;color:#166534;background:#f0fdf4;padding:2px 6px;border-top:2px dashed #86efac;font-weight:600}
  .segbar{display:flex;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;width:fit-content}
  .segbar .seg+.seg{border-left:1px solid #e5e7eb}
  @media (max-width:560px){ .segbar{display:grid;grid-template-columns:1fr 1fr;width:100%} .segbar .seg{border-left:0!important;text-align:center} .segbar .seg:nth-child(even){border-left:1px solid #e5e7eb!important} .segbar .seg:nth-child(n+3){border-top:1px solid #e5e7eb} }
  /* One box per meet (like Athletic.net's meet list): tap a box to open that meet's own results page */
  .meetgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-bottom:16px}
  .meetcard{display:flex;flex-direction:column;gap:3px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:12px 14px;color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s}
  .meetcard:hover{border-color:var(--brand);box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .meetcard.live{border-color:#fca5a5;background:#fffafa}
  .meetcard .go{margin-top:6px;font-size:13px;font-weight:700;color:var(--brand)}
  .meetcard.live .go{color:#b91c1c}
  .sechead{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#4b5563;margin:4px 0 8px}
  .livetag{display:inline-flex;align-items:center;font-size:11px;font-weight:800;color:#b91c1c;background:#fee2e2;border-radius:999px;padding:1px 8px}
  /* A meet's page: list of events, tap one to see its results */
  .evlist{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;margin-bottom:12px}
  .evhead{font-size:12px;font-weight:800;color:#1d4ed8;background:#eff6ff;padding:5px 12px}
  .evrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid #f1f5f9;color:inherit;text-decoration:none}
  .evrow:hover{background:#f8fafc}
  .evrow .meta{font-size:12px;color:#6b7280;text-align:right;white-space:nowrap}
  .evrow .arrow{color:#9ca3af;font-size:18px;line-height:1}
  .backlink{display:inline-block;font-size:14px;font-weight:600;color:var(--brand);margin-bottom:8px;text-decoration:none}
  .backlink:hover{text-decoration:underline}
</style>

<div class="max-w-3xl mx-auto p-4">
  <h1 class="text-2xl font-bold" id="club"></h1>
  <p id="subTitle" class="text-gray-600 mb-3">Results &amp; Records</p>
  <!-- Results are public: anyone can see them without signing in. Signed-in parents also get their own athletes highlighted. -->
  <div id="app" class="hidden">
    <div class="segbar text-sm mb-3">
      <button id="modeLive" class="seg">🔴 Live</button>
      <button id="modeMeet" class="seg">Meet Results</button>
      <button id="modeSeason" class="seg">Season Rankings</button>
      <button id="modeRecords" class="seg">🏆 All-Time Records</button>
    </div>

    <div id="yearPick" class="flex flex-wrap items-center gap-3 mb-2 text-sm"></div>

    <div id="filters" class="flex flex-wrap gap-2 mb-2">
      <select id="evt" class="border rounded p-2"><option value="">All events</option></select>
      <select id="div" class="border rounded p-2"><option value="">All divisions</option></select>
      <select id="gen" class="border rounded p-2"><option value="">Boys &amp; Girls</option><option>Boy</option><option>Girl</option></select>
      <select id="conf" class="border rounded p-2"><option value="">Both leagues</option><option value="East">Eastern League</option><option value="West">Western League</option></select>
      <input id="q" class="border rounded p-2 flex-1" placeholder="Search name">
      <label id="qOnlyWrap" class="text-xs text-gray-700 flex items-center gap-1"><input type="checkbox" id="qOnly"> only athletes who met the qualifying standard</label>
      <button id="pdfBtn" type="button" class="border rounded p-2 px-3 bg-gray-800 text-white font-semibold">Download PDF</button>
    </div>
    <p id="hint" class="text-xs text-gray-500 mb-2"></p>
    <div id="list"><p class="text-gray-500">Loading…</p></div>
  </div>

  <!-- One meet's own page: results.html?meet=<id> (the link in each meet box, and on the timers' upload screen) -->
  <div id="meetView" class="hidden">
    <a class="backlink" href="results.html">← All meets</a>
    <div id="mvHead" class="bg-white rounded-xl shadow p-4 mb-3"></div>
    <div class="flex flex-wrap gap-2 mb-2">
      <select id="mvDiv" class="border rounded p-2"><option value="">All divisions</option></select>
      <select id="mvGen" class="border rounded p-2"><option value="">Boys &amp; Girls</option><option value="Boy">Boys</option><option value="Girl">Girls</option></select>
      <input id="mvQ" class="border rounded p-2 w-full sm:w-auto sm:flex-1 min-w-0" placeholder="Find an athlete">
      <button id="mvPdf" type="button" class="border rounded p-2 px-3 bg-gray-800 text-white font-semibold">Download PDF</button>
    </div>
    <div class="flex flex-wrap gap-4 mb-2 text-xs text-gray-700">
      <label id="mvMineWrap" class="hidden flex items-center gap-1"><input type="checkbox" id="mvMine"> only my athletes</label>
      <label class="flex items-center gap-1"><input type="checkbox" id="mvBest"> best marks ever at this meet (all years)</label>
    </div>
    <p id="mvHint" class="text-xs text-gray-500 mb-2"></p>
    <div id="mvBody"><p class="text-gray-500">Loading…</p></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const CFG=window.APP_CONFIG;
$('club').textContent=CFG.CLUB_NAME;
let sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } }); // avoid cross-tab navigator.locks deadlock when multiple app pages are open at once
let allResults=[], seasonBest=[], meets=[], mode='season';
let lastGroups=[];
let myIds=new Set(), myNames=[]; // the signed-in parent's own athletes (highlighted in results; "only my athletes" on a meet's page)
DIVISIONS.forEach(d=>{ $('div').add(new Option(d.name,d.name)); $('mvDiv').add(new Option(d.name,d.name)); });
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Results are public, so the page only asks for the columns that are open to everyone (no select('*')).
const RES_COLS='id,created_at,meet_id,registration_id,athlete_name,gender,division,event_code,event_name,is_relay,relay_runners,round,mark,mark_value,is_time,place,wind,team_code,heat,overall_place';
const MEET_COLS='id,name,meet_date,location,status,is_championship,season_year';
const PARAMS=new URLSearchParams(location.search);
const MEET_ID=PARAMS.get('meet')||PARAMS.get('live'); // ?live= is the older link on the timers' upload screen — same meet page

$('modeSeason').onclick=()=>setMode('season');
$('modeMeet').onclick=()=>setMode('meet');
$('modeRecords').onclick=()=>setMode('records');
$('modeLive').onclick=()=>setMode('live');
function setMode(m){
  mode=m;
  ['modeLive','modeSeason','modeMeet','modeRecords'].forEach(id=>$(id).classList.toggle('active', id==='mode'+m[0].toUpperCase()+m.slice(1)));
  $('yearPick').classList.toggle('hidden', mode!=='season'&&mode!=='meet');
  $('filters').classList.toggle('hidden', mode==='live'||mode==='meet'); // the meet tabs are just boxes; filters live on each meet's own page
  $('qOnlyWrap').classList.toggle('hidden', mode!=='season');
  $('conf').classList.toggle('hidden', mode==='records');
  try{ sessionStorage.setItem('resultsTab',mode); }catch(e){}
  render();
}

// No sign-in needed. If a parent happens to be signed in, their own athletes are highlighted.
async function loadMine(){
  try{
    const {data:{session}}=await sb.auth.getSession(); if(!session) return;
    const {data:mine}=await sb.from('registrations').select('id,first_name,last_name').eq('email',session.user.email);
    myIds=new Set((mine||[]).map(r=>r.id)); myNames=(mine||[]).map(r=>`${r.first_name} ${r.last_name}`.toLowerCase());
  }catch(e){ console.warn(e); }
}
(async()=>{
  const [{data:m,error}]=await Promise.all([sb.from('meets').select(MEET_COLS).order('meet_date',{ascending:false}), loadMine()]);
  if(error) console.error(error);
  meets=m||[];
  if(MEET_ID) return openMeetPage(MEET_ID);
  $('app').classList.remove('hidden');
  let start='meet'; try{ start=sessionStorage.getItem('resultsTab')||start; }catch(e){}
  setMode(start); // shows "Loading…" until the results arrive
  await loadAll();
  buildYearPicker();
  if(liveMeets().length) mode='live'; // on meet day the Live tab opens first
  setMode(mode);
  ['evt','div','gen','conf','qOnly'].forEach(i=>$(i).onchange=render); $('q').oninput=render;
  // Keep the Live boxes current (a meet turns live when its first results are uploaded).
  setInterval(async()=>{ if(mode!=='live'||document.hidden) return; await refreshSummary(); render(); },60000);
})();

// ---- Season (year) checkboxes: one per season that has results; the latest is checked to start ----
const meetYear=id=>{ const m=meets.find(x=>x.id===id); return m?m.season_year:null; };
const selYears=()=>new Set([...document.querySelectorAll('#yearPick input:checked')].map(x=>+x.value));
function buildYearPicker(){
  const years=[...new Set(allResults.map(r=>r.season_year).filter(Boolean))].sort((a,b)=>b-a);
  $('yearPick').innerHTML=years.length?`<span class="font-semibold text-gray-700">Season:</span>`+years.map((y,i)=>`<label class="flex items-center gap-1 bg-white border rounded-full px-3 py-1 cursor-pointer"><input type="checkbox" value="${y}" ${i===0?'checked':''}> ${y}</label>`).join(''):'';
  document.querySelectorAll('#yearPick input').forEach(cb=>cb.onchange=render);
}
async function pageAll(mk){ const all=[]; for(let f=0;;f+=1000){ const {data,error}=await mk().range(f,f+999); if(error){ console.error(error); break; } all.push(...(data||[])); if(!data||data.length<1000) break; } return all; }
let stds=[], recs=[];
async function loadRefs(){
  if(window.leagueReady) await window.leagueReady;
  const [ss,rc]=await Promise.all([ pageAll(()=>sb.from('qualifying_standards').select('*').order('id')), pageAll(()=>sb.from('conference_records').select('*').order('id')) ]);
  stds=ss; recs=rc.filter(r=>!r.scope||r.scope==='conference');
  const lgE=rc.filter(r=>r.scope==='east'), lgW=rc.filter(r=>r.scope==='west');
  if(lgE.length||lgW.length) window.LEAGUE_RECORDS={East:lgE,West:lgW}; // edited on the Site Admin page; falls back to league-records.js if none saved
}
const withMeet=rows=>attachConference(rows.map(r=>({...r,meet_name:r.meets?.name,meet_date:r.meets?.meet_date,season_year:meetYear(r.meet_id)})),{}); // every result row carries its team_code
async function loadAll(){
  // The server returns at most 1,000 rows per request and a league season has thousands of results, so page through everything.
  const [rr,sb2]=await Promise.all([
    pageAll(()=>sb.from('results').select(RES_COLS+', meets(name,meet_date)').order('id')),
    pageAll(()=>sb.from('season_best').select('*').order('id')),
    loadRefs()
  ]);
  allResults=withMeet(rr);
  seasonBest=attachConference(sb2,{});
}
// Live tab: only re-reads the current season's meets (cheap), so new uploads turn a box live.
async function refreshSummary(){
  const cur=curSeason(), ids=meets.filter(m=>m.season_year===cur).map(m=>m.id); if(!ids.length) return;
  const fresh=await pageAll(()=>sb.from('results').select(RES_COLS+', meets(name,meet_date)').in('meet_id',ids).order('id'));
  allResults=allResults.filter(r=>!ids.includes(r.meet_id)).concat(withMeet(fresh));
}

// Rows for the Season Rankings tab, before the division/gender/event/conference/search filters.
function baseRows(){
  const ys=selYears();
  if(mode==='records') return seasonBest;
  return allResults.filter(r=>ys.has(r.season_year)&&r.mark_value!=null); // ranked best-per-athlete within the checked season(s)
}

function populateEventFilter(){
  const seen=new Set(mode==='records'?(window.STANDARD_EVENTS||[]).map(e=>e.name):baseRows().map(r=>r.event_name).filter(Boolean));
  const order=(window.STANDARD_EVENTS||[]).map(e=>e.name);
  const names=[...seen].sort((a,b)=>{ const ia=order.indexOf(a), ib=order.indexOf(b); if(ia===-1&&ib===-1) return a.localeCompare(b); if(ia===-1) return 1; if(ib===-1) return -1; return ia-ib; });
  const keep=$('evt').value;
  $('evt').innerHTML='<option value="">All events</option>'+names.map(n=>`<option value="${n}">${n}</option>`).join('');
  if(names.includes(keep)) $('evt').value=keep;
}

function render(){
  if(mode==='live'){ renderLiveList(); return; }
  if(mode==='meet'){ renderMeetList(); return; }
  if(!allResults.length&&!seasonBest.length){ $('hint').textContent=''; $('list').innerHTML='<p class="text-gray-500">Loading…</p>'; return; }
  populateEventFilter();
  const d=$('div').value, g=$('gen').value, ev=$('evt').value, q=$('q').value.toLowerCase(), conf=$('conf').value;
  let rs=baseRows().filter(r=>(!d||r.division===d)&&(!g||r.gender===g)&&(!ev||r.event_name===ev)&&(!q||(r.athlete_name+' '+(r.relay_runners||'')).toLowerCase().includes(q)));
  const cap = mode==='records' ? 1 : null;
  if(mode==='records'){ renderRecordBoxes(d,g,ev,q); return; }
  const qOnly = mode==='season' && $('qOnly').checked;
  const groups=rankResults(rs,true,conf||null,cap);
  // Season rankings keep the top-50 club cap, but the qualifier count is taken from the FULL ranked list, and "only qualified" shows every qualifier at its true rank.
  groups.forEach(g=>{
    const f=g.rows[0]; g.std=f?stdFor(f):null; g.rec=f?recFor(f):null; g.lrecs=f?leagueRecs(f):[];
    const ranked=g.rows.filter(r=>r.mark_value!=null), rest=g.rows.filter(r=>r.mark_value==null);
    ranked.forEach((r,i)=>{ r._rank=i+1; r.q=isQ(r,g.std); });
    g.qCount=ranked.filter(r=>r.q).length; g.total=ranked.length;
    let show=ranked; if(mode==='season'&&!qOnly) show=ranked.slice(0,50); if(qOnly) show=ranked.filter(r=>r.q);
    g.rows=show.concat(qOnly?[]:rest); g.ref=refText(g);
  });
  const shown=qOnly?groups.filter(g=>g.rows.length):groups;
  lastGroups=shown;
  $('hint').textContent =
    mode==='records' ? 'The single best mark ever recorded per event, division, and gender — the club record book. "Q" = met the qualifying standard.' :
    (qOnly?'Only athletes who met the qualifying standard, at their true season rank.':'Best mark per athlete, top 50 per event/division/gender. "Q" = met the qualifying standard; the green line marks where the standard cuts off.');

  $('list').innerHTML=shown.map(gp=>{
    let lineDone=false;
    const rowsHtml=gp.rows.map(r=>{
      let sep='';
      if(mode==='season'&&!qOnly&&gp.std&&gp.qCount>0&&r.mark_value!=null&&!r.q&&!lineDone){ lineDone=true; sep=`<tr class="stdline"><td colspan="4">Qualifying standard ${fmtStd(gp.std,gp)} — everyone above this line met it</td></tr>`; }
      return sep+`<tr class="border-t rec-row">
      <td class="py-1 w-8 text-gray-500">${mode==='records'?'':(r.mark_value!=null?r._rank:'')}</td>
      <td class="py-1">${r.athlete_name}${r.team_code?` <span class="text-xs text-gray-400">${r.team_code}</span>`:''}${r.relay_runners?`<div class="text-xs text-gray-500">${r.relay_runners}</div>`:''}</td>
      <td class="py-1 font-mono text-right font-semibold">${r.mark}${r.wind?` <span class="text-xs text-gray-400">w${r.wind}</span>`:''}${r.q?' <span class="bdg bq" title="Met the qualifying standard">Q</span>':''}</td>
      <td class="py-1 text-right text-gray-500 text-xs">${(mode==='season'||mode==='records')?`${r.meet_name||''}`:((r.overall_place||r.place)?`${r.overall_place||r.place}${['st','nd','rd'][(r.overall_place||r.place)-1]||'th'} overall`:'')}</td></tr>`; }).join('');
    const ref=refHtml(gp);
    return `<div class="bg-white rounded-xl shadow p-3 mb-3">
    <div class="font-bold flex items-center gap-2">${mode==='records'?'<span class=\"rec-medal\">🏅</span>':''}${gp.division} ${gp.gender==='Boy'?'Boys':gp.gender==='Girl'?'Girls':gp.gender} — ${gp.event}</div>
    ${ref?`<div class="text-xs text-gray-500 mt-0.5">${ref}${gp.std&&mode!=='records'?` &nbsp;·&nbsp; <b class="text-green-700">${gp.qCount} of ${gp.total} met the standard</b>`:''}</div>`:''}
    <table class="w-full text-sm mt-1">${rowsHtml}</table></div>`; }).join('')
    ||'<p class="text-gray-500">'+(qOnly?'No athletes have met the standard for these filters yet.':'No results yet.')+'</p>';
}

// ---------- All-Time Records: one box per championship record book (Eastern League, Western League, IEC Conference) ----------
const REC_AGE_DIV={'5-6':'Sub-Gremlin','7-8':'Gremlin','9-10':'Bantam','11-12':'Juniors','13-14':'Youth','15-18':'Intermediates'};
function recBook(r){ return {...r, division:REC_AGE_DIV[r.age_low+'-'+r.age_high]||(r.age_low+'-'+r.age_high)}; }
function renderRecordBoxes(d,g,ev,q){
  const evs=window.STANDARD_EVENTS||[], evIdx=r=>evs.findIndex(e=>e.code===r.event_code&&!!e.relay===!!r.is_relay);
  const evName=r=>{ const e=evs[evIdx(r)]; return e?e.name:r.event_code; };
  const divOrder=DIVISIONS.map(x=>x.name);
  const books=[
    {title:'Eastern League Records', sub:'Eastern Open championship', rows:(window.LEAGUE_RECORDS||{}).East||[], empty:'No Eastern League records loaded yet.'},
    {title:'Western League Records', sub:'Western Open championship', rows:(window.LEAGUE_RECORDS||{}).West||[], empty:'No Western League records loaded yet.'},
    {title:'IEC Conference Records', sub:'Conference championship', rows:recs, empty:'No conference records loaded yet.'}
  ];
  const pdfGroups=[]; let html='';
  books.forEach(b=>{
    let rows=b.rows.map(recBook).filter(r=>(!d||r.division===d)&&(!g||r.gender===g)&&(!ev||evName(r)===ev)&&(!q||(r.holder+' '+(r.relay_names||'')+' '+(r.team||'')).toLowerCase().includes(q)));
    rows.sort((a,b2)=>((evIdx(a)<0?999:evIdx(a))-(evIdx(b2)<0?999:evIdx(b2)))||(divOrder.indexOf(a.division)-divOrder.indexOf(b2.division))||String(a.gender).localeCompare(String(b2.gender)));
    const byEv={}; rows.forEach(r=>{ (byEv[evName(r)]??=[]).push(r); });
    const inner=Object.entries(byEv).map(([name,rs])=>{

    $('mvHint').textContent='Best marks ever at this meet (all years).';
  } else {
    const hb=heatBlocks(e.g,curMeet); lastGroups=hb.pdfGroups; html=hb.html;
    $('mvHint').textContent='Results by heat — places are within each heat. "Q" = met the qualifying standard'+(curMeet.is_championship?'; "CR" = new conference record.':'.')+(myIds.size?' Your athletes are highlighted.':'');
  }
  $('mvBody').innerHTML=nav+(meetLive&&e.t?`<div class="liveposted">Posted ${clock(new Date(e.t))}${mvNew.has(e.k)?' <span class="bdg bnew">NEW</span>':''}</div>`:'')+(html||'<p class="text-gray-500">No results.</p>');
}
// "Find an athlete": every result for matching names in this meet, each linking to its event.
function renderAthleteSearch(q){
  const rows=meetRes.filter(mvFilter).filter(r=>(r.athlete_name+' '+(r.relay_runners||'')).toLowerCase().includes(q));
  const evs=sortedEvents(rows);
  lastGroups=evs.flatMap(e=>heatBlocks(e.g,curMeet).pdfGroups);
  $('mvHint').textContent='Every result in this meet for that name. Tap an event to see the whole race.';
  $('mvBody').innerHTML=evs.length?`<div class="evlist">${evs.map(e=>`<div class="evhead"><a href="#e=${encodeURIComponent(e.k)}">${esc(evLabel(e.f))} ›</a></div>${e.g.map(r=>`<div class="evrow${isMine(r)?' mine':''}"><div>${esc(r.athlete_name)}${r.team_code?` <span class="text-xs text-gray-400">${esc(r.team_code)}</span>`:''}${r.relay_runners?`<div class="text-xs text-gray-500">${esc(r.relay_runners)}</div>`:''}</div><div class="text-right"><span class="font-mono font-semibold">${esc(r.mark)}</span><div class="text-xs text-gray-500">${r.round==='P'?'Prelims':'Finals'}${r.heat?` · heat ${r.heat}`:''}${r.place>0?` · ${r.place}${['st','nd','rd'][r.place-1]||'th'}`:''}</div></div></div>`).join('')}`).join('')}</div>`
    :'<p class="text-gray-500">No one by that name in this meet.</p>';
}
$('mvPdf').onclick=async()=>{
  if(!lastGroups.length) return alert('Nothing to put in a PDF yet.');
  const title=`${curMeet.name} - ${fmtDate(curMeet.meet_date)} - ${meetLive?'Live Results (unofficial)':'Results'}`;
  const bits=[ $('mvDiv').value, $('mvGen').value?genLabel($('mvGen').value):'' ].filter(Boolean);
  const bytes=await window.resultsPdf(lastGroups,{title, subtitle:bits.length?bits.join('  |  '):'All divisions, boys & girls'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
  a.download=title.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.pdf'; a.click();
};
$('pdfBtn').onclick=async()=>{
  if(!lastGroups.length) return alert('Nothing to put in a PDF yet — change the filters first.');
  const title = mode==='records' ? 'All-Time Records' : 'Season Rankings';
  const bits=[ $('div').value, $('gen').value?($('gen').value==='Boy'?'Boys':'Girls'):'', $('evt').value, $('conf').value?$('conf').value+'ern League':'' ].filter(Boolean);
  const bytes=await window.resultsPdf(lastGroups,{title, subtitle:bits.length?bits.join('  |  '):'All divisions, boys & girls'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
  a.download=title.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.pdf'; a.click();
};
</script></body></html>
