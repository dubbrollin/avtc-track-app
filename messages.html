<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Messenger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=b1">
<script src="theme.js?v=b1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="shared.js"></script>
<style>
.btn{padding:.6rem 1rem;border-radius:.5rem;font-weight:600}
.sbtn{padding:.35rem .7rem;border-radius:.5rem;font-weight:600;font-size:.85rem}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#e5e7eb;white-space:nowrap}
.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.blue{background:var(--act-soft,#e6f0fc);color:var(--act-dark,#0f4fa3)}
#shell{display:grid;grid-template-columns:19rem 1fr;gap:12px;align-items:stretch}
#shell.hidden{display:none}
#listPane,#threadPane{background:#fff;border:1px solid var(--line,#e1e7ef);border-radius:10px;height:calc(100vh - 210px);min-height:26rem;display:flex;flex-direction:column;overflow:hidden}
#chanList{overflow:auto;flex:1}
.sect{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#5b6878;padding:.5rem .8rem .25rem;background:var(--soft,#f7f9fc);border-bottom:1px solid var(--line,#e1e7ef)}
.chan{display:block;width:100%;text-align:left;padding:.65rem .8rem;border-bottom:1px solid var(--line,#e1e7ef);cursor:pointer;background:#fff}
.chan:hover{background:var(--soft,#f7f9fc)}.chan.sel{background:var(--act-soft,#e6f0fc)}
.chan .nm{font-weight:700;display:flex;align-items:center;gap:.4rem}.chan .pv{font-size:12px;color:#5b6878;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{background:#d2451e;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:auto}
#msgs{flex:1;overflow:auto;padding:12px;background:var(--soft,#f7f9fc)}
.day{text-align:center;font-size:11px;color:#5b6878;margin:10px 0 6px;font-weight:600}
.m{max-width:min(34rem,85%);margin-bottom:8px}.m.mine{margin-left:auto}
.m .who{font-size:11px;color:#5b6878;margin:0 4px 2px}.m.mine .who{text-align:right}
.m .b{background:#fff;border:1px solid var(--line,#e1e7ef);border-radius:14px;padding:.5rem .75rem;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem}
.m.coach .b{border-left:3px solid var(--act,#1764c8)}
.m.mine .b{background:var(--act,#1764c8);color:#fff;border-color:var(--act,#1764c8)}.m.mine .b a{color:#fff}
.m .b a{text-decoration:underline}.m.gone .b{background:transparent;border-style:dashed;color:#8794a6;font-style:italic}
.m .del{font-size:11px;color:#8794a6;margin:0 4px;cursor:pointer;background:none;border:0}.m .del:hover{color:#b42318}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.m.mine .atts{justify-content:flex-end}
.atts img,.gal img{width:9.5rem;height:9.5rem;object-fit:cover;border-radius:10px;border:1px solid var(--line,#e1e7ef);background:#fff;cursor:zoom-in}
.file{display:inline-flex;align-items:center;gap:.4rem;background:#fff;border:1px solid var(--line,#e1e7ef);border-radius:10px;padding:.4rem .6rem;font-size:.85rem;text-decoration:none;color:inherit;max-width:16rem}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pending{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px 0;background:#fff}#pending:empty{display:none}
#pending .file button{color:#b42318;font-weight:700;background:none;border:0;cursor:pointer}
#composer{border-top:1px solid var(--line,#e1e7ef);padding:8px;display:flex;gap:8px;align-items:flex-end;background:#fff}
#composer.hidden{display:none}
#composer textarea{flex:1;resize:none;max-height:9rem;padding:.5rem .65rem;font-size:16px}
#attach{font-size:1.25rem;line-height:1;padding:.5rem .6rem;border-radius:.5rem;background:#f3f4f6;cursor:pointer;border:0}
#backBtn{display:none}
.gal{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:760px){
  #shell{grid-template-columns:1fr}
  #listPane,#threadPane{height:calc(100vh - 170px)}
  #shell.open #listPane{display:none} #shell:not(.open) #threadPane{display:none}
  #backBtn{display:inline-block}
  .atts img,.gal img{width:7rem;height:7rem}
}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9998;padding:1rem}
#modal>div{background:#fff;border-radius:12px;padding:16px;max-width:34rem;width:100%;max-height:90vh;overflow:auto}
.opt{display:flex;gap:.5rem;align-items:flex-start;border:1px solid var(--line,#e1e7ef);border-radius:8px;padding:.5rem .6rem;margin-bottom:6px;cursor:pointer;font-size:.9rem}
.opt:has(input:checked){border-color:var(--act,#1764c8);background:var(--act-soft,#e6f0fc)}
.rowbtn{display:flex;width:100%;text-align:left;gap:.5rem;align-items:center;padding:.5rem .6rem;border-bottom:1px solid var(--line,#e1e7ef);background:#fff;cursor:pointer;font-size:.9rem}
.rowbtn:hover{background:var(--act-soft,#e6f0fc)}
</style>
</head><body class="text-gray-900"><header class="topnav"><div class="topnav-inner">
  <a class="brand" href="home.html">VYC <b>Track &amp; Field</b></a>
  <nav>
    <a href="home.html">Home</a>
    <a href="index.html">Register</a>
    <a href="coach.html">Coach Dashboard</a>
    <a href="meets-admin.html?view=timer">Timer</a>
    <a href="parent.html">Parent Dashboard</a>
    <a href="messages.html">Messages</a>
    <a href="results.html">Results</a>
  </nav>
</div></header>
<div class="max-w-5xl mx-auto p-3">
  <div class="flex flex-wrap items-center gap-2 mb-2">
    <h1 class="text-2xl font-bold flex-1">Team Messenger</h1>
    <select id="teamSel" class="border rounded p-2 text-sm hidden"></select>
    <button id="alertsBtn" class="sbtn bg-gray-200 hidden">🔔 My alerts</button>
    <button id="logout" class="sbtn bg-gray-200 hidden">Sign out</button>
  </div>

  <div id="login" class="card max-w-xl"><div id="loginWidget"></div></div>
  <div id="notice"></div>
  <div id="adminBox"></div>

  <div id="shell" class="hidden">
    <div id="listPane">
      <div class="p-2 border-b">
        <b class="text-sm block mb-1" id="listTitle">Groups</b>
        <div class="flex flex-wrap gap-1">
          <button id="newBtn" class="sbtn bg-blue-600 text-white hidden">+ Group</button>
          <button id="dmBtn" class="sbtn bg-blue-600 text-white hidden">+ Direct message</button>
          <button id="permBtn" class="sbtn bg-gray-200 hidden">Coach permissions</button>
        </div>
      </div>
      <div id="chanList"></div>
      <button id="allDivBtn" class="hidden text-xs text-blue-700 underline p-2 text-left border-t">Add a chat group for every division</button>
    </div>
    <div id="threadPane">
      <div class="flex flex-wrap items-center gap-2 p-2 border-b">
        <button id="backBtn" class="sbtn bg-gray-200">← Groups</button>
        <div class="flex-1 min-w-0"><div class="font-bold truncate" id="chName">Pick a group</div><div class="text-xs text-gray-500" id="chSub"></div></div>
        <button id="galBtn" class="sbtn bg-gray-200 hidden">Photos</button>
        <button id="editBtn" class="sbtn bg-gray-200 hidden">Edit</button>
      </div>
      <div id="msgs"><p class="text-sm text-gray-500">Pick a group on the left to read its messages.</p></div>
      <div id="pending"></div>
      <div id="composer" class="hidden">
        <button id="attach" type="button" title="Add photos or files" aria-label="Add photos or files">📎</button>
        <input id="fileIn" type="file" multiple class="hidden" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt">
        <textarea id="body" rows="1" maxlength="2000" class="border rounded" placeholder="Write a message…"></textarea><button id="send" class="btn bg-blue-600 text-white">Send</button></div>
      <div id="readOnly" class="hidden text-xs text-gray-500 p-3 border-t bg-white"></div>
    </div>
  </div>
</div>
<div id="modal"><div id="modalBox"></div></div>
<script>
const $=id=>document.getElementById(id);
const CFG=window.APP_CONFIG, BUCKET='team-messages';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
const TEAM=c=>(window.VYC_TEAMS.find(t=>t.code===c)||{}).name||c;
const isImg=a=>/^image\/(jpeg|png|gif|webp)$/.test(a.type||'');
let sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } });
let uid=null, email=null, isSiteAdmin=false, myTeams=[], team=null, chans=[], cur=null, msgs=[], live=null, timer=null, files=[], urls={};

window.mountLoginWidget(sb, $('loginWidget'), {hint:"Sign in with the email you registered with — parents and coaches use the same sign-in."});
$('logout').onclick=()=>{ if(window.clearRoleFlags) window.clearRoleFlags(); sb.auth.signOut().then(()=>location.reload()); };
sb.auth.onAuthStateChange(async(_e,session)=>{
  if(!session||window.__authDone===session.user.id) return; window.__authDone=session.user.id; uid=session.user.id; email=session.user.email;
  sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } }); // rebuild client: the original can wedge after an OAuth redirect
  $('login').classList.add('hidden'); $('logout').classList.remove('hidden');
  if(window.leagueReady) await window.leagueReady;
  await start();
});

function toast(m,bad){ let t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;padding:.6rem 1rem;border-radius:.5rem;font-size:.9rem;z-index:9999;display:none;max-width:90vw'; document.body.appendChild(t); }
  t.textContent=m; t.style.background=bad?'#991b1b':'#111827'; t.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display='none',bad?6000:2500); }
const clean=e=>String((e&&e.message)||e).replace(/^.*?: /,'');

async function start(){
  try{ const {data:c}=await sb.from('coaches').select('*').eq('email',email).eq('approved',true).maybeSingle(); if(c){ isSiteAdmin=!!c.is_admin; if(window.setRoleFlags) window.setRoleFlags(c); } }catch(e){}
  const {data,error}=await sb.rpc('msg_my_teams');
  if(error){ // the database part isn't installed yet
    $('notice').innerHTML=`<div class="card"><b>Team Messenger isn't set up yet.</b><p class="text-sm text-gray-600 mt-1">The league is still switching this feature on. Check back soon.</p><p class="text-xs text-gray-400 mt-1">${esc(clean(error))}</p></div>`; return; }
  myTeams=data||[];
  $('alertsBtn').classList.remove('hidden');
  if(isSiteAdmin) await drawAdminBox();
  const pickable=isSiteAdmin?window.VYC_TEAMS.filter(t=>t.active!==false).map(t=>t.code):myTeams.map(t=>t.team_code);
  if(!pickable.length){ $('notice').innerHTML=`<div class="card"><b>No team found for ${esc(email)}.</b><p class="text-sm text-gray-600 mt-1">Team Messenger is for the parents and coaches of a team. Sign in with the email you used to register your athlete (or to sign up as a coach). Not registered yet? <a class="text-blue-600 underline" href="index.html">Register here</a>.</p></div>`; return; }
  const want=new URLSearchParams(location.search).get('team');
  team=pickable.includes(want)?want:(myTeams.find(t=>t.enabled)||myTeams[0]||{}).team_code||pickable[0];
  if(pickable.length>1){ $('teamSel').innerHTML=pickable.map(c=>`<option value="${esc(c)}" ${c===team?'selected':''}>${esc(TEAM(c))}</option>`).join(''); $('teamSel').classList.remove('hidden');
    $('teamSel').onchange=()=>{ team=$('teamSel').value; cur=null; loadTeam(); }; }
  await loadTeam();
  clearInterval(timer); timer=setInterval(()=>{ if(!document.hidden) refresh(); },25000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });
}

const myRow=()=>myTeams.find(t=>t.team_code===team)||null;
const canManage=()=>isSiteAdmin||!!(myRow()&&myRow().can_manage);
const canStart=()=>canManage()||!!(myRow()&&myRow().can_post);
async function teamOn(){ const r=myRow(); if(r) return r.enabled; const {data}=await sb.from('team_messaging').select('enabled').eq('team_code',team).maybeSingle(); return !!(data&&data.enabled); }

async function loadTeam(){
  const r=myRow(), on=await teamOn(), tn=esc(TEAM(team));
  $('shell').classList.add('hidden'); $('notice').innerHTML='';
  if(!on){
    $('notice').innerHTML=(r&&!r.is_coach&&!isSiteAdmin)
      ? `<div class="card"><b>${tn} hasn't turned on Team Messenger.</b><p class="text-sm text-gray-600 mt-1">When your team switches it on, messages from your coaches will show up here.</p></div>`
      : `<div class="card" style="border:2px solid #f59e0b;background:#fffbeb"><span class="pill warn">Paid add-on</span>
          <h2 class="font-bold mt-2">Team Messenger is not switched on for ${tn}</h2>
          <p class="text-sm text-gray-700 mt-1">Message your parents right inside the app — the whole team at once, one division (age group), boys or girls only, a coaches-only group, or one parent directly. Send photos and files, and parents get an email or text when there's something new.</p>
          <p class="text-sm text-gray-700 mt-1">Team Messenger is part of the paid team extras. ${isSiteAdmin?'Switch it on for this team in the box above.':'Ask the league site admin to switch it on for your team.'}</p></div>`;
    return; }
  if(r&&!r.is_coach&&r.waiting&&!isSiteAdmin){ $('notice').innerHTML=`<div class="card"><b>Almost there.</b><p class="text-sm text-gray-600 mt-1">You'll be added to ${tn}'s message groups as soon as the team has reviewed your athlete's registration.</p></div>`; return; }
  if(r&&r.is_coach&&!r.can_post) $('notice').innerHTML=`<div class="card text-sm" style="background:#fffbeb;border:1px solid #f59e0b">You can read your division's groups and use <b>Coaches only</b>. To message parents, ask your team admin to give you permission.</div>`;
  if(canManage()&&r&&!r.has_admin) $('notice').innerHTML=`<div class="card text-sm" style="background:#fef2f2;border:1px solid #dc2626"><b>${tn} has no team admin yet.</b> Every chat must have a team admin in it, so groups and direct messages can't be created until one is approved (Site Admin → People &amp; Access).</div>`;
  $('shell').classList.remove('hidden');
  $('listTitle').textContent=TEAM(team);
  await loadChannels();
  if(!cur&&chans.length&&window.innerWidth>760) openChannel(chans[0].id);
  subscribe();
}

async function loadChannels(){
  const {data,error}=await sb.rpc('msg_my_channels',{p_team:team});
  if(error){ toast(clean(error),true); return; }
  chans=data||[];
  $('newBtn').classList.toggle('hidden',!canManage()); $('permBtn').classList.toggle('hidden',!canManage()); $('allDivBtn').classList.toggle('hidden',!canManage());
  $('dmBtn').classList.toggle('hidden',!canStart());
  const row=c=>`<button type="button" class="chan ${cur===c.id?'sel':''}" data-ch="${c.id}">
      <div class="nm"><span class="truncate">${esc(c.name)}</span>${c.archived?'<span class="pill">closed</span>':''}${c.unread&&cur!==c.id?`<span class="unread">${c.unread}</span>`:''}</div>
      <div class="pv">${c.last_at?`<b>${esc((c.last_sender||'').split(' ')[0])}:</b> ${esc(c.last_body)}`:esc(who(c))}</div></button>`;
  const groups=chans.filter(c=>c.audience!=='direct'), dms=chans.filter(c=>c.audience==='direct');
  $('chanList').innerHTML=(groups.map(row).join('')+(dms.length?`<div class="sect">Direct messages</div>`+dms.map(row).join(''):''))
    || `<p class="text-sm text-gray-500 p-3">${canManage()?'No groups yet. Tap “+ Group” to make the first one.':'No message groups for you yet.'}</p>`;
  navBadge();
}
function navBadge(){ const n=chans.reduce((a,c)=>a+(cur===c.id?0:(c.unread||0)),0); document.title=(n?`(${n}) `:'')+'Team Messenger'; }
function who(c){ const g=c.genders&&c.genders.length===1?(c.genders[0]==='Boy'?' · boys':' · girls'):'';
  return c.audience==='direct'?'Direct message':c.audience==='coaches'?'Coaches only':c.audience==='team'?'Whole team'+g:(c.divisions||[]).join(', ')+g; }

$('chanList').onclick=e=>{ const b=e.target.closest('[data-ch]'); if(b) openChannel(b.dataset.ch); };
$('backBtn').onclick=()=>{ $('shell').classList.remove('open'); cur=null; loadChannels(); };

async function openChannel(id){
  cur=id; const c=chans.find(x=>x.id===id); if(!c) return;
  files=[]; drawPending();
  $('shell').classList.add('open');
  document.querySelectorAll('.chan').forEach(b=>b.classList.toggle('sel',b.dataset.ch===id));
  $('chName').textContent=c.name;
  $('chSub').innerHTML=c.audience==='direct'
    ? `Direct message · ${c.my_role==='admin'?'you are in this chat as a team admin':'your team admins can also see this conversation'}`
    : `${esc(who(c))}${c.audience!=='coaches'?` · ${c.families} famil${c.families===1?'y':'ies'}`:''} · ${c.mode==='announce'?'announcements — only coaches post':'two-way chat'} · team admins are in every chat`;
  $('editBtn').classList.toggle('hidden',!c.can_manage); $('editBtn').textContent=c.audience==='direct'?(c.archived?'Re-open':'Close chat'):'Edit';
  $('galBtn').classList.remove('hidden');
  $('composer').classList.toggle('hidden',!c.can_post); $('readOnly').classList.toggle('hidden',c.can_post);
  $('readOnly').textContent=c.archived?'This chat is closed.':c.my_role==='coach_read'?(c.audience==='team'?"Only a Head Coach or team admin with permission can post to the whole team.":"Your team admin hasn't given you permission to message parents yet."):'Only the coaches can post in this group.';
  $('msgs').innerHTML='<p class="text-sm text-gray-500">Loading…</p>';
  await loadMessages(true);
}

// Photos and files are private: each one gets a short-lived link when it's shown.
async function signAll(list){
  const need=[...new Set(list.flatMap(m=>(m.attachments||[]).map(a=>a.path)))].filter(p=>!urls[p]||urls[p].exp<Date.now());
  if(!need.length) return;
  try{ const {data}=await sb.storage.from(BUCKET).createSignedUrls(need,3600); (data||[]).forEach(x=>{ if(x.signedUrl) urls[x.path]={url:x.signedUrl,exp:Date.now()+50*60000}; }); }catch(e){}
}
const U=p=>(urls[p]||{}).url||'';
const attHtml=a=>{ const u=U(a.path); if(!u) return `<span class="file">📎 <span>${esc(a.name)}</span></span>`;
  return isImg(a)?`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="${esc(a.name)}" loading="lazy"></a>`
    :`<a class="file" href="${esc(u)}" target="_blank" rel="noopener" download="${esc(a.name)}">📎 <span>${esc(a.name)}</span></a>`; };

async function loadMessages(jump){
  const id=cur; if(!id) return;
  const {data,error}=await sb.from('msg_messages').select('*').eq('channel_id',id).order('created_at',{ascending:false}).limit(300);
  if(id!==cur) return;
  if(error){ $('msgs').innerHTML=`<p class="text-sm text-red-700">${esc(clean(error))}</p>`; return; }
  const next=(data||[]).reverse(), box=$('msgs');
  const sig=l=>l.map(m=>m.id+(m.deleted_at?'x':'')).join(','); const changed=sig(next)!==sig(msgs)||jump; msgs=next;
  if(!changed) return;
  await signAll(msgs); if(id!==cur) return;
  const nearEnd=box.scrollHeight-box.scrollTop-box.clientHeight<120, c=chans.find(x=>x.id===id)||{};
  let day='';
  box.innerHTML=msgs.map(m=>{ const d=new Date(m.created_at), dk=d.toDateString(), mine=m.sender_id===uid, att=m.attachments||[];
    const head=dk!==day?`<div class="day">${d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>`:''; day=dk;
    const t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    return head+`<div class="m ${mine?'mine':''} ${m.sender_role==='coach'?'coach':''} ${m.deleted_at?'gone':''}">
      <div class="who">${mine?'You':`<b>${esc(m.sender_name)}</b>${m.sender_label?' · '+esc(m.sender_label):''}`} · ${t}${!m.deleted_at&&(mine||c.can_manage)?` <button class="del" data-del="${m.id}">remove</button>`:''}</div>
      ${m.deleted_at?'<div class="b">Message removed</div>':(m.body?`<div class="b">${linkify(m.body)}</div>`:'')+(att.length?`<div class="atts">${att.map(attHtml).join('')}</div>`:'')}</div>`; }).join('')
    || `<p class="text-sm text-gray-500">No messages yet.${c.can_post?' Say hello 👋':''}</p>`;
  if(jump||nearEnd){ box.scrollTop=box.scrollHeight; box.querySelectorAll('img').forEach(i=>i.addEventListener('load',()=>{ box.scrollTop=box.scrollHeight; },{once:true})); }
  sb.rpc('msg_mark_read',{p_channel:id}).then(()=>{ const x=chans.find(y=>y.id===id); if(x) x.unread=0; navBadge(); });
}
$('msgs').onclick=async e=>{ const b=e.target.closest('[data-del]'); if(!b) return; if(!confirm('Remove this message for everyone?')) return;
  const m=msgs.find(x=>x.id===b.dataset.del), paths=((m&&m.attachments)||[]).map(a=>a.path);
  if(paths.length){ try{ await sb.storage.from(BUCKET).remove(paths); }catch(e){} }
  const {error}=await sb.rpc('msg_delete',{p_message:b.dataset.del}); if(error){ toast(clean(error),true); return; } loadMessages(); };

/* ---------- photos & files ---------- */
$('attach').onclick=()=>$('fileIn').click();
$('fileIn').onchange=async e=>{ for(const f of [...e.target.files]){ if(files.length>=6){ toast('Six photos or files at most per message.',true); break; }
    const g=await shrink(f); if(g.size>10*1024*1024){ toast(`${f.name} is over 10 MB.`,true); continue; } files.push(g); }
  e.target.value=''; drawPending(); };
function drawPending(){ $('pending').innerHTML=files.map((f,i)=>`<span class="file">${/^image\//.test(f.type)?'🖼️':'📎'} <span>${esc(f.name)}</span> <button type="button" data-rm="${i}" aria-label="Remove">✕</button></span>`).join(''); }
$('pending').onclick=e=>{ const b=e.target.closest('[data-rm]'); if(!b) return; files.splice(+b.dataset.rm,1); drawPending(); };
// Phone photos are huge — shrink big JPEG/PNG photos to 2000px before uploading.
async function shrink(f){ if(!/^image\/(jpeg|png)$/.test(f.type)||f.size<1.5*1024*1024) return f;
  try{ const bmp=await createImageBitmap(f), k=Math.min(1,2000/Math.max(bmp.width,bmp.height)), cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height); const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
    return blob&&blob.size<f.size?new File([blob],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f; }catch(e){ return f; } }
function openGallery(){ const pics=msgs.filter(m=>!m.deleted_at).flatMap(m=>(m.attachments||[]).filter(isImg).map(a=>({a,m}))).reverse(), docs=msgs.filter(m=>!m.deleted_at).flatMap(m=>(m.attachments||[]).filter(a=>!isImg(a))).reverse();
  openModal(`<h2 class="font-bold text-lg mb-2">Photos &amp; files — ${esc($('chName').textContent)}</h2>
    ${pics.length?`<div class="gal">${pics.map(({a,m})=>`<a href="${esc(U(a.path))}" target="_blank" rel="noopener" title="${esc(m.sender_name)} · ${new Date(m.created_at).toLocaleDateString()}"><img src="${esc(U(a.path))}" alt="${esc(a.name)}" loading="lazy"></a>`).join('')}</div>`:'<p class="text-sm text-gray-500">No photos in this chat yet.</p>'}
    ${docs.length?`<h3 class="font-bold mt-3 mb-1">Files</h3><div class="flex flex-wrap gap-2">${docs.map(attHtml).join('')}</div>`:''}
    <div class="mt-3"><button class="btn bg-gray-200" onclick="closeModal()">Close</button></div>`); }
$('galBtn').onclick=openGallery;

async function send(){
  const ta=$('body'), text=ta.value.trim(), ch=cur; if((!text&&!files.length)||!ch) return;
  $('send').disabled=true; $('send').textContent=files.length?'Uploading…':'Sending…';
  try{
    const att=[];
    for(const f of files){ const path=`${ch}/${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]+/g,'_').slice(-80)}`;
      const {error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||'application/octet-stream'}); if(error) throw new Error(`${f.name}: ${clean(error)}`);
      att.push({path,name:f.name,type:f.type,size:f.size}); }
    const {data:id,error}=await sb.rpc('msg_post',{p_channel:ch,p_body:text,p_attachments:att}); if(error) throw error;
    ta.value=''; ta.style.height='auto'; files=[]; drawPending();
    sb.functions.invoke('msg-notify',{body:{message_id:id}}).catch(()=>{}); // email / text alerts go out in the background
    await loadMessages(true); loadChannels();
  }catch(e){ toast(clean(e),true); }
  $('send').disabled=false; $('send').textContent='Send';
}
$('send').onclick=send;
$('body').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>760){ e.preventDefault(); send(); } });
$('body').addEventListener('input',e=>{ e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,144)+'px'; });

async function refresh(){ if($('shell').classList.contains('hidden')) return; await loadChannels(); if(cur) await loadMessages(); }
// New messages arrive live; the 25-second check above is the safety net.
function subscribe(){ try{ if(live) sb.removeChannel(live); live=sb.channel('team-messenger').on('postgres_changes',{event:'*',schema:'public',table:'msg_messages'},()=>refresh()).subscribe(); }catch(e){} }

/* ---------- create / edit a group (team admins) ---------- */
function openModal(html){ $('modalBox').innerHTML=html; $('modal').style.display='flex'; }
function closeModal(){ $('modal').style.display='none'; }
$('modal').addEventListener('mousedown',e=>{ if(e.target===$('modal')) closeModal(); });
$('newBtn').onclick=()=>groupForm(null);
$('editBtn').onclick=async()=>{ const c=chans.find(x=>x.id===cur); if(!c) return; if(c.audience!=='direct') return groupForm(c);
  if(!confirm(c.archived?'Re-open this direct message?':'Close this direct message? The parent stops seeing it; the history is kept for the team admins.')) return;
  const {error}=await sb.rpc('msg_save_channel',{p_id:c.id,p_team:team,p_name:c.name,p_audience:'team',p_divisions:null,p_genders:null,p_mode:'chat',p_archived:!c.archived});
  if(error){ toast(clean(error),true); return; } await loadChannels(); openChannel(c.id); };
function groupForm(c){
  const a=c?c.audience:'team', g=c&&c.genders&&c.genders.length===1?c.genders[0]:'', md=c?c.mode:'chat', divs=(c&&c.divisions)||[];
  const rad=(n,v,on,html)=>`<label class="opt"><input type="radio" name="${n}" value="${v}" ${on?'checked':''} class="mt-1"><span>${html}</span></label>`;
  openModal(`<h2 class="font-bold text-lg mb-2">${c?'Edit group':'New message group'} — ${esc(TEAM(team))}</h2>
    <label class="text-sm font-semibold">Group name</label>
    <input id="gName" maxlength="60" class="border rounded p-2 w-full mb-3" placeholder="e.g. Bantam parents, Meet-day updates" value="${esc(c?c.name:'')}">
    <div class="text-sm font-semibold mb-1">Who is in it?</div>
    ${rad('gAud','team',a==='team','<b>The whole team</b> — every parent and every coach')}
    ${rad('gAud','divisions',a==='divisions','<b>Certain divisions (age groups)</b> — those parents, plus the coaches signed up for those divisions')}
    <div id="gDivBox" class="flex flex-wrap gap-x-4 gap-y-1 ml-6 mb-2 text-sm ${a==='divisions'?'':'hidden'}">${window.DIVISIONS.map(d=>`<label class="flex items-center gap-1"><input type="checkbox" data-div value="${esc(d.name)}" ${divs.includes(d.name)?'checked':''}> ${esc(d.name)} <span class="text-xs text-gray-400">${d.min}–${d.max}</span></label>`).join('')}</div>
    ${rad('gAud','coaches',a==='coaches','<b>Coaches only</b> — parents never see it')}
    <div id="gParentBox" class="${a==='coaches'?'hidden':''}">
      <label class="text-sm font-semibold mt-2 block">Boys, girls, or both?</label>
      <select id="gGen" class="border rounded p-2 w-full mb-3"><option value="">Both</option><option value="Boy" ${g==='Boy'?'selected':''}>Boys' parents only</option><option value="Girl" ${g==='Girl'?'selected':''}>Girls' parents only</option></select>
      <div class="text-sm font-semibold mb-1">Can parents write back?</div>
      ${rad('gMode','chat',md==='chat','<b>Two-way chat</b> — parents can reply')}
      ${rad('gMode','announce',md==='announce','<b>Announcements</b> — only coaches post; parents read')}
    </div>
    ${c?`<label class="flex items-center gap-2 text-sm mt-2"><input type="checkbox" id="gArch" ${c.archived?'checked':''}> Close this group (parents stop seeing it; coaches keep the history)</label>`:''}
    <p class="text-xs text-gray-500 mt-2">Team admins are in every group automatically. Parents are added once the team has reviewed their athlete's registration. Coaches can read their own divisions' groups; they can post once you give them permission (“Coach permissions”).</p>
    <div class="flex gap-2 mt-3"><button id="gSave" class="btn bg-blue-600 text-white">${c?'Save':'Create group'}</button><button id="gCancel" class="btn bg-gray-200">Cancel</button><span id="gMsg" class="text-sm text-red-600 self-center"></span></div>`);
  const aud=()=>document.querySelector('input[name=gAud]:checked').value;
  document.querySelectorAll('input[name=gAud]').forEach(r=>r.onchange=()=>{ $('gDivBox').classList.toggle('hidden',aud()!=='divisions'); $('gParentBox').classList.toggle('hidden',aud()==='coaches'); });
  $('gCancel').onclick=closeModal;
  $('gSave').onclick=async()=>{ const A=aud(), gen=$('gGen').value;
    const {data,error}=await sb.rpc('msg_save_channel',{p_id:c?c.id:null,p_team:team,p_name:$('gName').value,p_audience:A,
      p_divisions:A==='divisions'?[...document.querySelectorAll('[data-div]:checked')].map(x=>x.value):null,p_genders:gen?[gen]:null,
      p_mode:document.querySelector('input[name=gMode]:checked').value,p_archived:c?$('gArch').checked:false});
    if(error){ $('gMsg').textContent=clean(error); return; }
    closeModal(); toast(c?'Saved':'Group created'); await loadChannels(); openChannel(data||cur); };
}
$('allDivBtn').onclick=async()=>{
  const have=new Set(chans.filter(c=>c.audience==='divisions'&&(c.divisions||[]).length===1&&!c.genders).map(c=>c.divisions[0]));
  const todo=window.DIVISIONS.map(d=>d.name).filter(n=>!have.has(n));
  if(!todo.length){ toast('Every division already has a group.'); return; }
  if(!confirm(`Create ${todo.length} two-way chat group${todo.length>1?'s':''} — one for each division: ${todo.join(', ')}?`)) return;
  for(const n of todo){ const {error}=await sb.rpc('msg_save_channel',{p_id:null,p_team:team,p_name:n+' parents',p_audience:'divisions',p_divisions:[n],p_genders:null,p_mode:'chat',p_archived:false}); if(error){ toast(clean(error),true); break; } }
  loadChannels();
};

/* ---------- direct message: pick an athlete, talk to that athlete's parent ---------- */
$('dmBtn').onclick=async()=>{
  openModal(`<h2 class="font-bold text-lg mb-1">Direct message a parent</h2>
    <p class="text-xs text-gray-500 mb-2">Pick the athlete — the message goes to that athlete's parent only. ${canManage()?'':'You can message parents of athletes in your own division. '}Your team admins can always see direct messages.</p>
    <input id="dmQ" class="border rounded p-2 w-full mb-2" placeholder="Search by athlete name…"><div id="dmList" class="border rounded" style="max-height:50vh;overflow:auto"><p class="text-sm text-gray-500 p-2">Loading…</p></div>
    <div class="mt-3"><button class="btn bg-gray-200" onclick="closeModal()">Cancel</button></div>`);
  const {data,error}=await sb.rpc('team_roster'); if(error){ $('dmList').innerHTML=`<p class="text-sm text-red-700 p-2">${esc(clean(error))}</p>`; return; }
  const list=(data||[]).filter(r=>r.team_code===team&&['reviewed','verified'].includes(r.status)).sort((a,b)=>(a.last_name||'').localeCompare(b.last_name||'')||(a.first_name||'').localeCompare(b.first_name||''));
  const draw=()=>{ const q=$('dmQ').value.trim().toLowerCase(), L=list.filter(r=>!q||`${r.first_name} ${r.last_name}`.toLowerCase().includes(q));
    $('dmList').innerHTML=L.map(r=>`<button type="button" class="rowbtn" data-reg="${r.id}"><b>${esc(r.last_name)}, ${esc(r.first_name)}</b><span class="text-xs text-gray-500">${esc(r.division||'')} · ${esc(r.gender||'')}</span><span class="ml-auto text-xs text-blue-700">Message parent →</span></button>`).join('')
      ||`<p class="text-sm text-gray-500 p-2">${list.length?'No athlete matches.':'No reviewed athletes yet — a parent can be messaged once the team has reviewed the registration.'}</p>`; };
  draw(); $('dmQ').oninput=draw; $('dmQ').focus();
  $('dmList').onclick=async e=>{ const b=e.target.closest('[data-reg]'); if(!b) return;
    const {data:id,error}=await sb.rpc('msg_start_dm',{p_registration:b.dataset.reg}); if(error){ toast(clean(error),true); return; }
    closeModal(); await loadChannels(); openChannel(id); };
};

/* ---------- team admin: which coaches may message parents ---------- */
$('permBtn').onclick=async()=>{
  openModal(`<h2 class="font-bold text-lg mb-1">Coach permissions — ${esc(TEAM(team))}</h2>
    <p class="text-xs text-gray-500 mb-2">Tick a coach to let them message parents. A coach can only post to (and direct-message) parents in the divisions they signed up to coach; a Head Coach covers the whole team. Unticked coaches can still read their divisions' groups and use “Coaches only”. Team admins are in every chat.</p>
    <div id="permList"><p class="text-sm text-gray-500">Loading…</p></div><div class="mt-3"><button class="btn bg-gray-200" onclick="closeModal()">Done</button></div>`);
  const [{data:cs,error},{data:acc}]=await Promise.all([sb.from('coaches').select('*').eq('team_code',team).eq('approved',true), sb.from('msg_coach_access').select('*').eq('team_code',team)]);
  if(error){ $('permList').innerHTML=`<p class="text-sm text-red-700">${esc(clean(error))}</p>`; return; }
  const on={}; (acc||[]).forEach(a=>on[a.email.toLowerCase()]=a.can_post);
  const nm=c=>c.name||`${c.first_name||''} ${c.last_name||''}`.trim()||c.email;
  const scope=c=>c.role_type==='division_coach'&&!/^all/i.test(c.division_or_age_group||'')?`${c.division_or_age_group||'—'}${c.coach_gender?' · '+c.coach_gender:''}`:'Whole team';
  const L=(cs||[]).filter(c=>c.role_type!=='timer').sort((a,b)=>nm(a).localeCompare(nm(b)));
  $('permList').innerHTML=L.map(c=>`<label class="flex items-center gap-2 border-b py-2 text-sm">
      ${c.team_admin?'<span class="pill ok">Team admin</span>':`<input type="checkbox" data-coach="${esc(c.email)}" ${on[c.email.toLowerCase()]?'checked':''}>`}
      <span class="flex-1"><b>${esc(nm(c))}</b> <span class="text-xs text-gray-500">${c.team_admin?'in every chat':esc(c.role_type==='head_coach'?'Head Coach':c.role_type==='division_coach'?'Division Coach':'Coach')+' · '+esc(scope(c))}</span></span></label>`).join('')
    ||'<p class="text-sm text-gray-500">No approved coaches on this team yet.</p>';
  $('permList').onchange=async e=>{ const cb=e.target.closest('[data-coach]'); if(!cb) return;
    const {error}=await sb.rpc('msg_set_coach_access',{p_team:team,p_email:cb.dataset.coach,p_on:cb.checked}); if(error){ toast(clean(error),true); cb.checked=!cb.checked; return; }
    toast(cb.checked?'They can now message parents':'Permission removed'); };
};

/* ---------- my alerts: email and/or text when there's a new message ---------- */
$('alertsBtn').onclick=async()=>{
  const {data:p}=await sb.from('msg_prefs').select('*').maybeSingle(); const d=p||{email_on:true,sms_on:false,sms_phone:''};
  openModal(`<h2 class="font-bold text-lg mb-1">My message alerts</h2>
    <p class="text-xs text-gray-500 mb-3">Get a heads-up when your team posts something new. You get one alert per group, then no more for that group until you've opened it — so a busy chat won't flood you.</p>
    <label class="opt"><input type="checkbox" id="pEmail" ${d.email_on?'checked':''} class="mt-1"><span><b>Email me</b> at ${esc(email)}</span></label>
    <label class="opt"><input type="checkbox" id="pSms" ${d.sms_on?'checked':''} class="mt-1"><span><b>Text me</b><br><input id="pPhone" type="tel" class="border rounded p-2 mt-1" placeholder="Mobile number" value="${esc((d.sms_phone||'').replace(/^\+1/,''))}"></span></label>
    <p class="text-xs text-gray-500">By turning on texts you agree to receive team message alerts from VYC Track &amp; Field at this number. Message and data rates may apply. Reply STOP to any text to stop them.</p>
    <div class="flex gap-2 mt-3"><button id="pSave" class="btn bg-blue-600 text-white">Save</button><button class="btn bg-gray-200" onclick="closeModal()">Cancel</button><span id="pMsg" class="text-sm text-red-600 self-center"></span></div>`);
  $('pSave').onclick=async()=>{ const {error}=await sb.rpc('msg_save_prefs',{p_email_on:$('pEmail').checked,p_sms_on:$('pSms').checked,p_phone:$('pPhone').value});
    if(error){ $('pMsg').textContent=clean(error); return; } closeModal(); toast('Saved'); };
};

/* ---------- site admin: the paid switch, per team ---------- */
async function drawAdminBox(){
  const {data}=await sb.from('team_messaging').select('*'); const on={}; (data||[]).forEach(r=>on[r.team_code]=r);
  const teams=window.VYC_TEAMS.filter(t=>t.active!==false), n=teams.filter(t=>on[t.code]&&on[t.code].enabled).length;
  $('adminBox').innerHTML=`<details class="card"${n?'':' open'}><summary class="font-bold cursor-pointer">Site admin — Team Messenger add-on (paid): on for ${n} of ${teams.length} teams</summary>
    <p class="text-xs text-gray-500 my-2">Team Messenger is a paid team extra. Switch it on for a team once they've paid; switching it off hides the groups but keeps every message.</p>
    <div class="grid gap-1" style="grid-template-columns:repeat(auto-fit,minmax(17rem,1fr))">${teams.map(t=>{ const r=on[t.code], y=!!(r&&r.enabled);
      return `<label class="flex items-center gap-2 text-sm border rounded-lg p-2"><input type="checkbox" data-sw="${esc(t.code)}" ${y?'checked':''}> <span class="flex-1">${esc(t.name)}</span><span class="pill ${y?'ok':''}">${y?'ON':'off'}</span></label>`; }).join('')}</div></details>`;
}
$('adminBox').onchange=async e=>{ const cb=e.target.closest('[data-sw]'); if(!cb) return; const code=cb.dataset.sw, on=cb.checked;
  if(!confirm(on?`Switch Team Messenger ON for ${TEAM(code)}? Their coaches and parents can start messaging right away.`:`Switch Team Messenger OFF for ${TEAM(code)}? Their groups are hidden (messages are kept).`)){ cb.checked=!on; return; }
  const {error}=await sb.rpc('msg_set_enabled',{p_team:code,p_on:on}); if(error){ toast(clean(error),true); cb.checked=!on; return; }
  toast(on?'Switched on':'Switched off'); const r=myTeams.find(t=>t.team_code===code); if(r) r.enabled=on;
  await drawAdminBox(); if(code===team){ cur=null; await loadTeam(); } };
</script></body></html>
